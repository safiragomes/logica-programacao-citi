<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lógica de Programação — CITi</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Figtree:wght@400;600;800&family=JetBrains+Mono:wght@500;700&family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: trilha de jogo (mapa vertical com dois blocos) + telas de nível em coluna única. Modo aula adiciona cronômetro e navegação por teclado. */
:root{
  --brand:#2ddb60; --brand-deep:#1aa84a; --brand-ink:#04301b;
  --bg:#f1f9f4; --surface:#ffffff; --surface2:#e3f4ea; --line:#c9e3d3;
  --fg:#0a2316; --muted:#4a6757;
  --pink:#ffb1c7; --pink-deep:#e0527f;
  --good:#0c8f4b; --good-bg:#d9f7e5; --bad:#cf2f4c; --bad-bg:#fde3e8; --warn:#9a6200; --warn-bg:#fff0cf;
  --code-bg:#0c2018; --code-fg:#e4f6ea;
  --f-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#06140d; --surface:#0d2117; --surface2:#123122; --line:#1e4a32;
  --fg:#e7f7ed; --muted:#93b8a3;
  --good:#3fe088; --good-bg:#0f3a24; --bad:#ff7a90; --bad-bg:#3d1620; --warn:#ffcb6b; --warn-bg:#3b2d0b;
  --code-bg:#030d08; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#06140d; --surface:#0d2117; --surface2:#123122; --line:#1e4a32;
  --fg:#e7f7ed; --muted:#93b8a3;
  --good:#3fe088; --good-bg:#0f3a24; --bad:#ff7a90; --bad-bg:#3d1620; --warn:#ffcb6b; --warn-bg:#3b2d0b;
  --code-bg:#030d08; color-scheme:dark;}

/* tema escuro fixo (os dois modos) — identidade da EJ (CITi 30 anos), verde técnico, Poppins; rosa substituído por verde em toda a aplicação */
body{
  --brand:#2ddb60 !important; --brand-deep:#1aa84a !important; --brand-ink:#04150a !important;
  --bg:#040906 !important; --surface:#0b1511 !important; --surface2:#101e19 !important; --line:#1c3a2c !important;
  --fg:#f7f9f8 !important; --muted:#93b0a5 !important;
  --pink:#2ddb60 !important; --pink-deep:#1aa84a !important;
  --good:#2ddb60 !important; --good-bg:#102a1c !important; --bad:#ff6b7a !important; --bad-bg:#2a1016 !important; --warn:#ffcb6b !important; --warn-bg:#2a2208 !important;
  --code-bg:#020806 !important; --code-fg:#dff3ea !important;
  --f-display:'Poppins',system-ui,sans-serif !important;
  --f-body:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif !important;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--f-body);min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:30}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:1.55rem;font-weight:800}
p{margin:.5em 0}
code{font-family:var(--f-mono);font-size:.88em;background:var(--surface2);padding:.1em .38em;border-radius:6px}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pink-deep);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink);box-shadow:0 3px 0 var(--brand-deep)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;border:0;background:none;padding:0;cursor:pointer}
.brand img{height:34px;width:auto;display:block}
.hud{display:contents}
.brk{display:none}
.top .wrap{gap:10px 14px}
.stats{display:flex;align-items:center;gap:10px;margin-left:auto;min-width:0}
.tools{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.55);border-radius:999px;padding:5px 12px;font:800 .9rem var(--f-display);color:var(--brand-ink);white-space:nowrap}
.xpbar{width:64px;height:8px;border-radius:99px;background:rgba(4,48,27,.2);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--brand-ink);border-radius:99px}
.hearts{display:inline-flex;gap:3px;background:rgba(255,255,255,.55);border-radius:999px;padding:5px 10px}
.hearts svg{width:18px;height:18px}
.tbtn{display:inline-flex;align-items:center;gap:7px;border:0;background:rgba(255,255,255,.55);color:var(--brand-ink);border-radius:999px;height:36px;padding:0 14px 0 11px;font:800 .85rem var(--f-display);cursor:pointer;transition:background .15s,transform .1s}
.tbtn:hover{background:rgba(255,255,255,.85)}.tbtn:active{transform:scale(.96)}
.tbtn svg{width:18px;height:18px;flex:0 0 auto}
.msw{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:rgba(4,48,27,.16)}
.modebtn{border:0;background:transparent;color:var(--brand-ink);border-radius:999px;height:30px;padding:0 14px;font:800 .85rem var(--f-display);cursor:pointer;transition:background .15s,color .15s}
.modebtn[aria-pressed="false"]:hover{background:rgba(255,255,255,.4)}
.modebtn[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand);box-shadow:0 2px 0 rgba(0,0,0,.2)}
@media (max-width:640px){
  .msw{order:2;margin-left:auto}
  .brk{display:block;order:3;flex:0 0 100%;height:0}
  .stats{order:4;margin-left:0;flex:1;min-width:0}
  .tools{order:5}
  .tbtn{width:36px;padding:0;justify-content:center}.tbtn span{display:none}
  .modebtn{padding:0 11px}
}

main{padding-block:22px 80px}

/* botões */
.btn{font:800 1.02rem var(--f-display);border:0;border-radius:14px;padding:11px 22px;background:var(--brand);color:var(--brand-ink);box-shadow:0 12px 26px -14px color-mix(in srgb,var(--brand) 75%,transparent);cursor:pointer;transition:transform .12s,filter .12s,box-shadow .12s}
.btn:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0);filter:brightness(.97)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.ghost{background:color-mix(in srgb,var(--surface) 90%,transparent);color:var(--fg);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--brand);filter:none}
.btn.small{font-size:.9rem;padding:7px 14px;border-radius:12px}
.btn.pink{background:var(--pink);color:var(--brand-ink);box-shadow:0 12px 26px -14px color-mix(in srgb,var(--pink) 75%,transparent)}

/* mapa — hero em estética de slide de capa */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid color-mix(in srgb,var(--brand) 14%,var(--line));border-radius:28px;padding:26px 28px;margin-bottom:26px;box-shadow:0 20px 48px -30px rgba(0,0,0,.55);background-image:var(--bg-open,none);background-repeat:no-repeat;background-position:right -10% bottom -30%;background-size:min(380px,34%) auto}
.hero .txt{position:relative;z-index:1;flex:1 1 280px;min-width:0}
.hero .txt>.tag{display:inline-block;background:none;color:var(--brand);padding:0;margin:0 0 12px;letter-spacing:.16em}
.hero .txt>.tag::before{content:"";display:block;width:30px;height:3px;border-radius:99px;background:var(--brand);margin-bottom:10px}
.hero h1{font-size:clamp(1.9rem,6vw,2.7rem);font-weight:800}
.hero p{color:var(--muted);font-weight:600;max-width:60ch}
.hero .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 14px;font:800 .9rem var(--f-display);cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.block{margin-bottom:34px}
.bhead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.bhead h3{font-size:1.3rem}
.bhead small{color:var(--muted);font-weight:600;display:block}
.trail{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;position:relative}
.node{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:color-mix(in srgb,var(--surface2) 55%,transparent);border:1.5px solid var(--line);border-radius:18px;padding:12px 16px;cursor:pointer;transition:transform .12s,border-color .12s}
.node:hover{transform:translateY(-2px);border-color:var(--brand)}
.node .n{flex:0 0 auto;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font:800 1.3rem var(--f-display);background:none;color:var(--brand);border:2px solid var(--line)}
.node.done .n{background:color-mix(in srgb,var(--brand) 16%,var(--surface));border-color:var(--brand);color:var(--brand)}
.node.next{border-color:var(--brand)}
.node.next .n{border-color:var(--brand);box-shadow:0 0 0 5px color-mix(in srgb,var(--brand) 18%,transparent);animation:ringpulse 2s ease-in-out infinite}
.node .info{flex:1;min-width:0}
.node .info b{font:800 1.1rem var(--f-display);display:block}
.node .info span{color:var(--muted);font-size:.92rem}
.node .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto}
.stars{display:flex;gap:2px}
.stars svg{width:18px;height:18px}
.tchip{font:800 .75rem var(--f-display);background:none;border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));color:var(--warn);border-radius:99px;padding:2px 10px;white-space:nowrap}
@media (min-width:640px){.trail .node:nth-child(even){margin-left:36px;width:calc(100% - 36px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,248,125,.55)}50%{box-shadow:0 0 0 10px rgba(0,248,125,0)}}
.summary{background:var(--warn-bg);color:var(--warn);border-radius:16px;padding:10px 16px;font-weight:800;margin-bottom:22px}

/* nível */
.lvhead{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.lvhead .back{border:2px solid var(--line);background:var(--surface);border-radius:12px;width:40px;height:40px;cursor:pointer;font:800 1.2rem var(--f-display)}
.lvhead h1{font-size:1.25rem;font-weight:800;flex:1;min-width:120px}
.dots{display:flex;gap:6px;width:100%;order:5}
.dots i{flex:1;height:10px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--brand)}
.dots i.now{background:var(--brand-deep)}
.timer{display:flex;align-items:center;gap:8px;background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:4px 6px 4px 12px;font:800 1rem var(--f-display)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.timer .tnum{font-variant-numeric:tabular-nums;min-width:3.4em}
.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:20px}
.card h2{margin-bottom:12px}
.coach{margin-bottom:16px}
.say{position:relative;background:var(--surface2);border-radius:18px;padding:12px 16px;font-weight:600;min-width:0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-12px) scale(.98,1.03)}}
.foot{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.lab{background:var(--surface2);border-radius:18px;padding:14px 16px;margin:14px 0}
.lab h4{margin:0 0 8px;font:800 1rem var(--f-display);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.out{font:700 1rem var(--f-mono);background:var(--surface);border:2px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;overflow-x:auto;min-height:2.8em}
.out.err{color:var(--bad);border-color:var(--bad)}
.out.ok{color:var(--good);border-color:var(--good)}
.code{background:var(--code-bg);color:var(--code-fg);border-radius:14px;padding:12px 16px;overflow-x:auto;font:500 .88rem/1.65 var(--f-mono);margin:10px 0;white-space:pre}
.code .t-k{color:#ff9dbb}.code .t-s{color:#8df5b5}.code .t-n{color:#ffd27a}.code .t-c{color:#7f9c8b;font-style:italic}
.code .hl{background:rgba(0,248,125,.22);border-radius:4px}
.ipo{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:stretch}
.ipo .b{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.ipo .b b{font:800 1.05rem var(--f-display)}
.ipo .b span{font-size:.85rem;color:var(--muted)}
.ipo .a{align-self:center;font:800 1.4rem var(--f-display);color:var(--muted)}
@media (max-width:520px){.ipo{grid-template-columns:1fr}.ipo .a{transform:rotate(90deg);justify-self:center}}
input[type=text],input[type=number],select{font:600 1rem var(--f-mono);padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=number]{width:5.5em}
input[type=range]{accent-color:var(--good);width:min(320px,100%)}
.chip{border:1.5px solid var(--line);background:color-mix(in srgb,var(--surface2) 55%,transparent);border-radius:12px;padding:6px 12px;font:700 .95rem var(--f-mono);cursor:pointer;transition:transform .1s,border-color .1s}
.chip:active{transform:translateY(1px)}
.chip.on{background:color-mix(in srgb,var(--brand) 16%,var(--surface));color:var(--brand);border-color:var(--brand)}
.chip:disabled{opacity:.4}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;margin-bottom:10px;border:1.5px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--surface2) 55%,transparent);font:700 1rem var(--f-body);cursor:pointer;transition:border-color .12s,transform .12s}
.opt:hover:not(:disabled){border-color:var(--brand);transform:translateY(-1px)}
.opt.good{border-color:var(--good);background:var(--good-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
.opt code{background:transparent;padding:0}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{border-radius:14px;padding:12px 14px;margin-top:6px;font-weight:600}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.info{background:var(--warn-bg);color:var(--warn)}
.tag{display:inline-block;font:800 .75rem var(--f-display);text-transform:uppercase;letter-spacing:.06em;background:var(--pink);color:var(--brand-ink);border-radius:99px;padding:2px 10px;margin-left:8px;vertical-align:middle}
.placed{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.placed div{display:flex;gap:10px;align-items:center;background:var(--good-bg);color:var(--good);border-radius:12px;padding:10px 12px;font-weight:700}
.placed b{font:800 1rem var(--f-display);background:var(--good);color:var(--surface);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
textarea.ed{width:100%;min-height:190px;resize:vertical;background:var(--code-bg);color:var(--code-fg);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:500 .9rem/1.6 var(--f-mono);tab-size:2}
.tests{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:6px}
.tests li{font:600 .85rem var(--f-mono);padding:7px 10px;border-radius:10px;background:var(--surface2);overflow-wrap:anywhere}
.tests li.p{background:var(--good-bg);color:var(--good)}
.tests li.f{background:var(--bad-bg);color:var(--bad)}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-weight:800}
.tbl td.t{color:var(--good);font-weight:800;font-family:var(--f-mono)}
.tbl td.f{color:var(--bad);font-weight:800;font-family:var(--f-mono)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mini{background:var(--surface2);border-radius:16px;padding:12px 14px;min-width:0}
.mini b{font:800 1rem var(--f-display)}
.mini .code{margin:8px 0 0;font-size:.8rem}
.finish{text-align:center;padding:26px 18px}
.finish .stars{justify-content:center;margin:10px 0}
.finish .stars svg{width:38px;height:38px}
.finish .row{justify-content:center;margin-top:16px}
.check{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.check li{display:flex;gap:10px;align-items:center;font-weight:700}
.check i{width:22px;height:22px;border-radius:50%;background:var(--line);flex:0 0 auto;display:grid;place-items:center;color:var(--brand-ink);font-style:normal;font-size:.8rem}
.check li.on i{background:var(--brand)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--brand-ink);color:var(--brand);font:800 1rem var(--f-display);padding:8px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot-note{text-align:center;color:var(--muted);font-size:.85rem;margin-top:30px}
/* historinha */
.scene{position:relative;height:210px;border-radius:18px;overflow:hidden;margin-bottom:14px;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(#a6e6ff,#eafff4)}
.scene.dawn{background:linear-gradient(#ff9fbd,#ffe6b8)}
.scene.dusk{background:linear-gradient(#7b6cf0,#ffb7c9)}
.scene.night{background:radial-gradient(#fff 1px,transparent 1.6px) 0 0/38px 38px,linear-gradient(#1f1450,#6a3d9c)}
.scene::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-46px;height:86px;border-radius:50%;background:#62d98f}
.scene.night::after,.scene.dusk::after{background:#23895a}
.scene .sprites{position:relative;z-index:2;display:flex;align-items:flex-end;margin-bottom:-4px}
.sign{position:absolute;right:7%;bottom:44px;z-index:1;background:#d29a5c;color:#3b2208;font:800 .95rem var(--f-display);padding:6px 12px;border-radius:8px;border:3px solid #8a5a2b;transform:rotate(3deg);max-width:42%;text-align:center}
.sign::after{content:"";position:absolute;left:50%;top:100%;width:8px;height:34px;background:#8a5a2b;transform:translateX(-50%)}
.narr{font-size:1.08rem;margin:6px 0}
.speech{display:flex;gap:10px;align-items:baseline;background:var(--surface2);border-radius:16px;padding:10px 14px;font-weight:700;margin-top:12px}
.speech b{font-family:var(--f-display);white-space:nowrap}
/* fases, laboratório e quebra-cabeça de blocos */
.phases{order:4;width:100%;display:flex;gap:6px;flex-wrap:wrap}
.phases span{font:800 .78rem var(--f-display);text-transform:uppercase;letter-spacing:.07em;padding:2px 11px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.phases span.on{background:var(--brand);color:var(--brand-ink)}
.phases span.past{opacity:.6}
.ribbon{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.ribbon b{font:800 .85rem var(--f-display);text-transform:uppercase;letter-spacing:.08em;padding:3px 13px;border-radius:99px}
.ribbon.teoria b{background:var(--brand);color:var(--brand-ink)}
.ribbon.pratica b{background:var(--pink);color:#4a0f26}
.ribbon.historia b{background:var(--warn-bg);color:var(--warn)}
.ribbon.fim b{background:var(--surface2);color:var(--fg)}
.ribbon span{color:var(--muted);font-weight:800;font-size:.9rem}
.ribbon em{font-style:normal;color:var(--muted);font-weight:600;font-size:.9rem;margin-left:auto}
.recap{display:flex;gap:10px;align-items:baseline;background:var(--good-bg);color:var(--good);border-radius:14px;padding:10px 14px;margin-top:14px;font-weight:700}
.recap b{font-family:var(--f-display);white-space:nowrap}
.labbox textarea.ed{min-height:0}
.hintkey{color:var(--muted);font-size:.8rem;font-weight:700}
.tchip.over{background:var(--bad-bg);color:var(--bad)}
.muted{color:var(--muted);font-size:.88rem;margin:6px 0}
.board-wrap{overflow-x:auto;max-width:100%}
.board{--cell:clamp(34px,calc((100vw - 80px) / var(--cols)),58px);position:relative;display:grid;grid-template-columns:repeat(var(--cols),var(--cell));grid-auto-rows:var(--cell);gap:2px;width:max-content;background:var(--line);padding:2px;border-radius:14px}
.cell{background:var(--surface2);border-radius:6px;position:relative}

.cell.w{background:radial-gradient(circle at 28% 30%,#37a96a 0 26%,transparent 28%),radial-gradient(circle at 72% 66%,#2a9158 0 28%,transparent 30%),#1d7048}
.gl{position:absolute;inset:2px}
.actor{position:absolute;z-index:3;width:var(--cell);height:var(--cell);left:calc(var(--c) * (var(--cell) + 2px) + 2px);top:calc(var(--r) * (var(--cell) + 2px) + 2px);transition:left .3s linear,top .3s linear;--dir-deg:0deg}

.blk .x{margin-left:auto}
.lvwrap{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.lvbar{position:relative;z-index:2;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lvbar .back{border:2px solid var(--line);background:var(--surface);border-radius:12px;width:40px;height:40px;cursor:pointer;font:800 1.2rem var(--f-display);color:var(--fg)}
.lvbar h1{font-size:1.1rem;font-weight:800;background:var(--surface);color:var(--fg);padding:6px 14px;border-radius:14px;flex:1 1 0;min-width:0}
.steps{list-style:none;counter-reset:s;padding:0;margin:10px 0;display:flex;flex-direction:column;gap:6px}

.steps li.bad{background:var(--bad-bg);color:var(--bad)}

/* cenário de fundo: suave, atrás do conteúdo */

body[data-sky="dusk"] .backdrop{--tint:#8b7cf0}

.sb{display:flex;align-items:center;gap:7px;min-height:40px;padding:7px 14px;background:var(--bc);border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--dk);white-space:nowrap}

/* apresentação contínua: capa, abertura e fim */

.stopic{margin-left:10px;font:800 .85rem var(--f-display);color:var(--muted);letter-spacing:.04em}

.cover{overflow:hidden;position:relative}

.op-tag{font:800 .95rem var(--f-display);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}

.open .cv-journey{margin-top:30px}.end .cv-journey{display:none}

/* fidelidade ao deck SDD/TDD (CITi 30 anos): cartões finos e translúcidos, crachá numérico sem preenchimento, cabeçalho sem barra colorida */

.acc{color:var(--brand)}

.sv-lamp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}@media(max-width:760px){.sv-lamp{grid-template-columns:1fr}}.sv-lamp>.rv{display:flex}

.sv-lamp .stp b{font:800 1.2rem var(--f-display);line-height:1.2}
.sv-lamp .ka{background:var(--good-bg);border-color:var(--good)}.sv-lamp .kb{background:var(--warn-bg);border-color:var(--warn)}.sv-lamp .kb i{background:#ffd95a}.sv-lamp .kc{background:color-mix(in srgb,var(--pink) 35%,var(--surface));border-color:var(--pink-deep)}.sv-lamp .kc i{background:var(--pink)}

.sv-ask{display:grid;justify-items:center;gap:6px;text-align:center}.sv-ask .q{font:800 clamp(6rem,18vw,12rem)/1 var(--f-display);color:var(--pink-deep)}

a.btn{display:inline-flex;align-items:center;text-decoration:none}

.sv-lamp .stp b{min-width:0;overflow-wrap:anywhere}
.fit{display:flex;flex-direction:column}.sv-body{flex:1;display:flex;flex-direction:column;justify-content:center}

@media(max-width:480px){.lvbar #rev span{display:none}}

/* mapa do aspirante: trilha limpa, sem cenário infantil */
.wmap{position:relative;width:100%;max-width:720px;margin:6px auto 26px;aspect-ratio:800/1700;border-radius:28px;overflow:hidden;background:var(--surface);border:1px solid color-mix(in srgb,var(--brand) 14%,var(--line));box-shadow:0 20px 48px -28px rgba(0,0,0,.5)}
.wm-bg{position:absolute;inset:0;width:100%;height:100%}
.wm-bg .wground{fill:var(--surface)}
.wm-bg .wdots{opacity:.5;color:var(--line)}
.wm-bg .wpath0{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.wm-bg .wpath{fill:none;stroke:var(--brand-deep);stroke-width:3;stroke-dasharray:1 11;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.wn{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;cursor:pointer;display:grid;justify-items:center;width:20%}
.wn .wc{width:clamp(38px,9vw,60px);aspect-ratio:1;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font:800 clamp(1rem,2.8vw,1.5rem) var(--f-display);color:var(--fg);transition:transform .15s,border-color .15s}
.wn:hover .wc{transform:translateY(-2px);border-color:var(--brand)}
.wn.done .wc{background:color-mix(in srgb,var(--brand) 16%,var(--surface));border-color:var(--brand);color:var(--brand)}
.wn.next .wc{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 5px color-mix(in srgb,var(--brand) 18%,transparent);animation:ringpulse 2s ease-in-out infinite}
.wn .wl{position:absolute;top:100%;margin-top:6px;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid var(--line);border-radius:10px;padding:2px 10px;font:700 clamp(.65rem,1.7vw,.9rem)/1.25 var(--f-body);text-align:center;width:max-content;max-width:150%;display:grid;gap:0;justify-items:center}
.wn .wl b{font-weight:800}
@keyframes ringpulse{0%,100%{box-shadow:0 0 0 5px color-mix(in srgb,var(--brand) 18%,transparent)}50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--brand) 8%,transparent)}}
.wsign{position:absolute;left:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--surface) 92%,transparent);color:var(--brand);border:1px solid color-mix(in srgb,var(--brand) 40%,var(--line));border-radius:99px;padding:5px 16px;font:800 clamp(.68rem,1.7vw,.85rem) var(--f-display);text-transform:uppercase;letter-spacing:.08em;white-space:normal;max-width:50%;pointer-events:none}
.wend{position:absolute;left:50%;bottom:1.6%;transform:translateX(-50%);font:800 clamp(.8rem,2.2vw,1rem) var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--brand);background:none;border:1px solid color-mix(in srgb,var(--brand) 40%,var(--line));border-radius:99px;padding:5px 18px}
.wsign.wleft{left:4%;transform:translateY(-50%)}

/* ===== identidade v3: linguagem visual dos slides CITi (preto, verde, vidro) ===== */
:root{color-scheme:dark}

.lvbar h1{background:rgba(8,17,12,.8);border:1px solid rgba(45,219,96,.16);font-weight:700}
.lvbar .back{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:var(--fg)}
.lvbar .back:hover{border-color:var(--brand)}
.foot .btn.ghost{background:rgba(8,17,12,.8)}
/* conteúdo Subárea Dev (CITi): slides originais 1920x1080 escalados, fiéis ao arquivo de origem */
.sdk-wrap{position:relative;left:50%;transform:translateX(-50%);width:max(320px,min(1280px,calc(100vw - 32px),calc((100vh - 230px)*16/9)));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.sdk-frame{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;border-radius:16px;background:#050806;box-shadow:0 24px 60px -24px rgba(0,0,0,.7);border:1px solid rgba(45,219,96,.25)}
.sdk-canvas{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.sdk-sec{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;box-sizing:border-box;text-align:left;line-height:normal}
.sdk-sec *{box-sizing:border-box}
.sdk-sec p,.sdk-sec h1,.sdk-sec h2,.sdk-sec h3{margin:0}
.sdk-sec h1,.sdk-sec h2{font-family:'Poppins',Arial,sans-serif;text-wrap:initial}
.sdk-sec img{max-width:none;display:block}
.sdk-sec svg{display:block;flex:none}
.sdk-sec>*{position:relative;z-index:1}
.sdk-sec>[style*="absolute"]{position:absolute;z-index:0}
.sdk-sec>p[style*="absolute"]{z-index:2}

/* fundo rosa durante a parte do <div>a, com transição */
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .9s ease;
 background:radial-gradient(60vw 50vh at 85% 10%,rgba(255,106,19,.18),transparent 70%),radial-gradient(70vw 60vh at 10% 90%,rgba(224,36,102,.28),transparent 70%),linear-gradient(160deg,#fdeff5,#f8c4d9)}
body.diva-on::after{opacity:1}
body.diva-on .lvbar h1{background:rgba(255,255,255,.75);color:#2b0f1c;border-color:rgba(224,36,102,.3)}
body.diva-on .foot .btn.ghost{background:rgba(255,255,255,.75);color:#2b0f1c;border-color:rgba(224,36,102,.35)}
body.diva-on .foot .btn:not(.ghost){background:#e02466;color:#fff}
.lvbar h1,.foot .btn{transition:background .6s,color .6s,border-color .6s}
body.diva-on .lvbar .back{background:rgba(255,255,255,.75);color:#2b0f1c;border-color:rgba(224,36,102,.35)}
@keyframes sdkIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.sdk-frame{animation:sdkIn .6s cubic-bezier(.2,.7,.2,1) both}
body.diva-on .sdk-frame{box-shadow:0 24px 60px -24px rgba(224,36,102,.55);border-color:rgba(224,36,102,.3)}
body.diva-on #saSkip{background:rgba(255,255,255,.75);color:#2b0f1c;border-color:rgba(224,36,102,.35)}
@media (prefers-reduced-motion:reduce){body::after{transition:none}.sdk-frame{animation:none}}
</style>

/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ACC_STOP=new Set(['de','da','do','das','dos','em','e','a','o','os','as','um','uma','no','na','nos','nas','com','que','é','ou','para']);
function acc(title){
  const words=String(title).split(' ');
  if(words.length<2)return esc(title);
  let n=1;
  while(n<words.length-1&&ACC_STOP.has(words[words.length-n].toLowerCase()))n++;
  if(n<2&&words.length>4)n=2;
  n=Math.min(n,3,words.length-1);
  const head=words.slice(0,-n).join(' '),tail=words.slice(-n).join(' ');
  return esc(head)+' <span class="acc">'+esc(tail)+'</span>';
}
function hl(src){
  const re=/(\/\/[^\n]*)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(const|let|var|function|return|if|else|for|while|of|in|break|continue|async|await|new|true|false|null|undefined|interface|type|typeof|number|string|boolean|Promise)\b|\b(\d+(?:\.\d+)?)\b/g;
  let out='',last=0,m;
  while((m=re.exec(src))){out+=esc(src.slice(last,m.index));const c=m[1]?'c':m[2]?'s':m[3]?'k':'n';out+='<span class="t-'+c+'">'+esc(m[0])+'</span>';last=re.lastIndex;}
  return out+esc(src.slice(last));
}
const code=(src)=>'<pre class="code"><code>'+hl(src)+'</code></pre>';
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const show=v=>v===undefined?'undefined':(typeof v==='string'?JSON.stringify(v):JSON.stringify(v));
let toastT;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),1500);}

async function execTests(p){
  const canon=v=>{if(Array.isArray(v))return v.map(canon);if(v&&typeof v==='object'){const o={};Object.keys(v).sort().forEach(k=>{o[k]=canon(v[k]);});return o;}return v;};
  const sh=v=>v===undefined?'undefined':JSON.stringify(v);
  let f;
  try{f=new Function(p.code+'\nreturn typeof '+p.fn+'==="function"?'+p.fn+':undefined;')();}
  catch(err){const m=String(err);return{error:m,noEval:/unsafe-eval|EvalError|Content Security/i.test(m)};}
  if(!f)return{error:'Não encontrei a função '+p.fn+'. Confira o nome.'};
  const res=[];
  for(const c of p.cases){
    try{const out=await f.apply(null,JSON.parse(JSON.stringify(c.args)));res.push({ok:sh(canon(out))===sh(canon(c.expected)),got:sh(out)});}
    catch(err){res.push({ok:false,got:'erro: '+err.message});}
  }
  return{res};
}

const WORKER_SRC='const execTests='+execTests.toString()+';const execLab='+execLab.toString()+';onmessage=async e=>{postMessage(e.data.lab?await execLab(e.data):await execTests(e.data));};';
function viaWorker(payload,main,ms,timeoutMsg){
  return new Promise(resolve=>{
    let done=false;const fin=r=>{if(!done){done=true;resolve(r);}};
    try{
      const w=new Worker(URL.createObjectURL(new Blob([WORKER_SRC],{type:'text/javascript'})));
      const to=setTimeout(()=>{w.terminate();fin({error:timeoutMsg});},ms);
      w.onmessage=e=>{clearTimeout(to);w.terminate();fin(e.data);};
      w.onerror=ev=>{clearTimeout(to);try{w.terminate();}catch(_){}if(ev.preventDefault)ev.preventDefault();main(payload).then(fin);};
      w.postMessage(payload);
    }catch(err){main(payload).then(fin);}
  });
}

 card:(t,pairs)=>'<div class="sv-idcard"><h4>'+t+'</h4>'+pairs.map(p=>'<div class="kv"><span>'+p[0]+'</span><b>'+p[1]+'</b></div>').join('')+'</div>'
};

const SUBAREA_SLIDES=[ {kind:'subarea',title:'Subárea Dev',html:'<div class="sdk-sec" id="cover" data-transition="fade" style="background:#050806;color:#F7F9F8;font-family:\'Poppins\', Arial, sans-serif;padding:170px 128px 110px;display:flex;flex-direction:column;justify-content:center;gap:10px"><img src="'+SA_BG_COVER+'" alt="" style="position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover"><div style="position:absolute;left:912px;top:268px;width:880px;height:495px;border-radius:32px;background:rgba(45,219,96,0.2);border:2px solid rgba(45,219,96,0.6)"></div><img src="'+SA_TEAM+'" alt="Integrantes da subárea de Dev do CITi posando com a bandeira verde do CITi" style="position:absolute;left:888px;top:244px;width:880px;height:495px;object-fit:cover;border-radius:32px;border:4px solid #F7F9F8;box-shadow:0 24px 70px rgba(0,0,0,0.55)"><p style="position:absolute;left:856px;top:700px;font-size:28px;font-weight:700;color:#04150A;background:#2DDB60;padding:14px 32px;border-radius:50px;box-shadow:0 12px 30px rgba(0,0,0,0.45)">A maior subárea do CITi</p><p style="font-size:26px;font-weight:700;letter-spacing:8px;color:#2DDB60;text-transform:uppercase;width:760px">CITi · Processo seletivo</p><h1 style="font-size:124px;font-weight:700;line-height:1.0;width:760px">Subárea</h1><p style="font-size:260px;font-weight:700;line-height:0.95;color:#2DDB60;width:760px">Dev</p><p style="font-size:40px;line-height:1.3;color:#D6E3DB;width:760px">Onde ideias viram produto de verdade.</p><div style="display:flex;flex-direction:row;gap:14px;padding-top:16px"><p style="font-size:24px;font-weight:600;color:#F7F9F8;border:2px solid rgba(45,219,96,0.8);padding:8px 26px;border-radius:40px">Squads</p><p style="font-size:24px;font-weight:600;color:#F7F9F8;border:2px solid rgba(45,219,96,0.8);padding:8px 26px;border-radius:40px">Ritos</p><p style="font-size:24px;font-weight:600;color:#F7F9F8;border:2px solid rgba(45,219,96,0.8);padding:8px 26px;border-radius:40px">Lab de Inovação</p  {kind:'subarea',title:'Aqui você constrói produto de verdade',html:'<div class="sdk-sec" id="dev" data-transition="fade" style="background:#050806;color:#F7F9F8;font-family:\'Poppins\', Arial, sans-serif;padding:190px 128px 140px;display:flex;flex-direction:column;justify-content:center;gap:40px"><img src="'+SA_BG_DEV+'" alt="" style="position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover"><div style="display:flex;flex-direction:column;gap:14px"><p style="font-size:24px;font-weight:700;letter-spacing:6px;color:#2DDB60;text-transform:uppercase">Subárea Dev · a maior do CITi</p><h2 style="font-size:80px;font-weight:700;line-height:1.08">Aqui você constrói <span style="color:#2DDB60">produto de verdade</span></h2></div><p style="font-size:36px;line-height:1.4;color:#D6E3DB;width:1300px">É em Dev que ideias viram software no ar, para clientes reais, em time.</p><div style="display:flex;flex-direction:row;gap:22px"><div style="flex:1;display:flex;flex-direction:column;gap:12px;background:rgba(6,16,11,0.66);backdrop-filter:blur(12px);border:2px solid rgba(45,219,96,0.55);border-radius:22px;padding:40px 34px"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#2DDB60" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg><p style="font-size:36px;font-weight:700;line-height:1.15">Projetos reais</p><p style="font-size:26px;line-height:1.4;color:#C9D8CF">Software de verdade para clientes de verdade.</p></div><div style="flex:1;display:flex;flex-direction:column;gap:12px;background:rgba(6,16,11,0.66);backdrop-filter:blur(12px);border:2px solid rgba(45,219,96,0.55);border-radius:22px;padding:40px 34px"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#2DDB60" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/><path d="M16 3.1a4 4 0 0 1 0 7.  {kind:'subarea',title:'Um ritmo que move a entrega',html:'<div class="sdk-sec" id="ritos" data-transition="fade" style="background:#050806;color:#F7F9F8;font-family:\'Poppins\', Arial, sans-serif;padding:190px 128px 130px;display:flex;flex-direction:column;justify-content:center;gap:36px"><img src="'+SA_BG_RITOS+'" alt="" style="position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover"><div style="display:flex;flex-direction:column;gap:14px"><p style="font-size:24px;font-weight:700;letter-spacing:6px;color:#2DDB60;text-transform:uppercase">Ritos de Dev</p><h2 style="font-size:76px;font-weight:700;line-height:1.08">Um ritmo que <span style="color:#2DDB60">move a entrega</span></h2></div><div style="display:flex;flex-direction:column;gap:14px"><p style="font-size:24px;font-weight:700;letter-spacing:4px;color:#2DDB60">NO SQUAD</p><div style="display:flex;flex-direction:row;gap:18px"><div style="flex:1;display:flex;flex-direction:column;gap:6px;background:rgba(6,16,11,0.66);backdrop-filter:blur(12px);border:2px solid rgba(45,219,96,0.5);border-radius:20px;padding:30px 28px"><p style="font-size:40px;font-weight:700">Planning</p><p style="font-size:28px;line-height:1.35;color:#C9D8CF">Define o ciclo</p></div><div style="flex:1;display:flex;flex-direction:column;gap:6px;background:rgba(6,16,11,0.66);backdrop-filter:blur(12px);border:2px solid rgba(45,219,96,0.5);border-radius:20px;padding:30px 28px"><p style="font-size:40px;font-weight:700">Working day</p><p style="font-size:28px;line-height:1.35;color:#C9D8CF">Constrói junto</p></div><div style="flex:1;display:flex;flex-direction:column;gap:6px;background:rgba(6,16,11,0.66);backdrop-filter:blur(12px);border:2px solid rgba(45,219,96,0.5);border-radius:20px;padding:30px 28px"><p style="font-size:40px;font-weight:700">Daily</p><p style="font-size:28px;line-height:1.35;color:#C9D8CF">Alinha rápido</p></div><div style="flex:1;display:flex;flex-direction:column;gap:6px;background:rgba(6,16,11,0.66);backdrop-filter:blur(12px);border:2px solid rgba(45,219,96,0.5);border-radius:20px;padding:30px 28px"><p style="font-size:40px;font-weight:700">Review</p><p style="font-size:28px;line-height:1.35;color:#C9D8CF">Mostra a entrega</p></div></div></div><div style="display:flex;flex-direction:column;gap:14px"><p style="font-size:24px;font-weight:700;letter-spacing:4px;color:#5CE1E6">EM TODA A SUBÁREA</p><div style="display:flex;flex-direction:row;gap:18px"><div style="flex:1;display:flex;flex-direction:column;gap:6px;background:rgba(6,16,11,0.66);backdrop-filter:blur(12px);border:2px solid rgba(92,225,230,0.55);border-radius:20px;padding:30px 32px"><p style="font-size:40px;font-weight:700">Call de Dev</p><p style="font-size:28px;line-height:1.35;color:#C9D8CF">Uma mostra de mundos: cada squad apresenta o que fez e como está o projeto.</p></div><div style="flex:1;display:flex;flex-direction:column;gap:6px;background:rgba(6,16,11,0.66);backdrop-filter:blur(12px);border:2px solid rgba(92,225,230,0.55);border-radius:20px;padding:30px 32px"><p style="font-size:40px;font-weight:700">Dev Day</p><p style="font-size:28px;line-height:1.35;color:#C9D8CF">A Working day geral: todos os squads construindo juntos.</p></div></div></div></div>'},
 {kind:'subarea',title:'Lab de Inovação',html:'<div class="sdk-sec" id="lab" data-transition="fade" style="background:#050806;color:#F7F9F8;font-family:\'Poppins\', Arial, sans-serif;padding:190px 128px 140px;display:flex;flex-direction:column;justify-content:center;gap:40px"><img src="'+SA_BG_LAB+'" alt="" style="position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover"><div style="display:flex;flex-direction:column;gap:14px"><p style="font-size:24px;font-weight:700;letter-spacing:6px;color:#2DDB60;text-transform:uppercase">Dev · Inovação</p><h2 style="font-size:88px;font-weight:700;line-height:1.05">Lab de <span style="color:#2DDB60">Inovação</span></h2></div><p style="font-size:36px;line-height:1.4;color:#D6E3DB;width:1150px">O laboratório que pesquisa e entende os processos de Dev para melhorá-los, trazendo o que está forte no mercado e faz sentido para a subárea.</p><div style="display:flex;flex-direction:row;gap:20px"><div style="flex:1;display:flex;flex-direction:column;gap:10px;background:rgba(6,16,11,0.66);backdrop-filter:blur(12px);border:2px solid rgba(45,219,96,0.55);border-radius:22px;padding:36px 30px"><p style="font-size:24px;font-weight:700;letter-spacing:4px;color:#2DDB60">01</p><p style="font-size:36px;font-weight:700;line-height:1.15">Radar de mercado</p><p style="font-size:26px;line-height:1.4;color:#C9D8CF">Tecnologias e práticas em alta.</p></div><div style="flex:1;display:flex;flex-direction:column;gap:10px;background:rgba(6,16,11,0.66);backdrop-filter:blur(12px);border:2px solid rgba(45,219,96,0.55);border-radius:22px;padding:36px 30px"><p style="font-size:24px;font-weight:700;letter-spacing:4px;color:#2DDB60">02</p><p style="font-size:36px;font-weight:700;line-height:1.15">Diagnóstico</p><p style="font-size:26px;line-height:1.4;color:#C9D8CF">Onde os processos de Dev podem melhorar.</p></div><div style="flex:1;display:flex;flex-direction:column;gap:10px;background:rgba(6,16,11,0.66);backdrop-filter:blur(12px);border:2px solid rgba(92,225,230,0.55);border-radius:22px;padding:36px 30px"><p style="font-size:24px;font-weight:700;letter-spacing:4px;color:#5CE1E6">03</p><p style="font-size:36px;font-weight:700;line-height:1.15">Experimentação</p><p style="font-size:26px;line-height:1.4;color:#C9D8CF">Testes pequenos antes de adotar.</p></div><div style="flex:1;display:flex;flex-direction:column;gap:10px;background:rgba(6,16,11,0.66);backdrop-filter:blur(12px);border:2px solid rgba(92,225,230,0.55);border-radius:22px;padding:36px 30px"><p style="font-size:24px;font-weight:700;letter-spacing:4px;color:#5CE1E6">04</p><p style="font-size:36px;font-weight:700;line-height:1.15">Inovação aplicada</p><p style="font-size:26px;line-height:1.4;color:#C9D8CF">O que provou valor chega aos squads.</p></div></div></div>'},
 {kind:'subarea',theme:'diva',title:'Onde a técnica encontra a voz',html:'<div class="sdk-sec" id="diva" data-transition="fade" style="background:#FDEFF5;color:#2B0F1C;font-family:\'Poppins\', Arial, sans-serif;padding:190px 128px 120px;display:flex;flex-direction:column;justify-content:center;gap:24px"><img src="'+SA_BG_DIVA+'" alt="" style="position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover"><img src="'+SA_LOGO+'" alt="Logo do coletivo div-a" style="width:360px;height:62px;object-fit:contain"><h2 style="font-size:76px;font-weight:700;line-height:1.08;width:860px">Onde a técnica<br><span style="color:#E02466">encontra a voz</span></h2><p style="font-size:30px;line-height:1.4;color:#5A2A40;width:840px">Em uma área majoritariamente masculina, o <b>&lt;div&gt;a</b> existe para acolher e para que as meninas se vejam umas nas outras.</p><div style="display:flex;flex-direction:row;align-items:center;gap:22px;width:840px"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#E02466" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/></svg><div style="display:flex;flex-direction:column;gap:2px"><p style="font-size:32px;font-weight:700;color:#E02466">Acolhimento</p><p style="font-size:26px;line-height:1.35;color:#5A2A40">Um lugar para chegar, pertencer e pedir ajuda.</p></div></div><div style="display:flex;flex-direction:row;align-items:center;gap:22px;width:840px"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#E02466" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg><div style="display:flex;flex-direction:column;gap:2px"><p style="font-size:32px;font-weight:700;color:#E02466">Identificação</p><p style="font-size:26px;line-height:1.35;color:#5A2A40">Ver outras mulheres ocupando espaço em Dev.</p></div></div><div style="display:flex;flex-direction:row;align-items:center;gap:22px;width:840px"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg><div style="display:flex;flex-direction:column;gap:2px"><p style="font-size:32px;font-weight:700;color:#C2410C">Impacto na subárea</p><p style="font-size:26px;line-height:1.35;color:#5A2A40">Mais mulheres entrando, ficando e crescendo.</p></div></div><img src="'+SA_P1+'" alt="Integrante do div-a sorrindo" style="position:absolute;left:1000px;top:230px;width:250px;height:320px;object-fit:cover;border-radius:28px;border:5px solid #FFFFFF;box-shadow:0 16px 36px rgba(224,36,102,0.28)"><img src="'+SA_P2+'" alt="Integrante do div-a de óculos sorrindo" style="position:absolute;left:1271px;top:290px;width:250px;height:320px;object-fit:cover;border-radius:28px;border:5px solid #FFFFFF;box-shadow:0 16px 36px rgba(224,36,102,0.28)"><img src="'+SA_P3+'" alt="Integrante do div-a de rabo de cavalo sorrindo" style="position:absolute;left:1542px;top:230px;width:250px;height:320px;object-fit:cover;border-radius:28px;border:5px solid #FFFFFF;box-shadow:0 16px 36px rgba(224,36,102,0.28)"><img src="'+SA_P4+'" alt="Integrante do div-a de óculos" style="position:absolute;left:1000px;top:580px;width:250px;height:320px;object-fit:cover;border-radius:28px;border:5px solid #FFFFFF;box-shadow:0 16px 36px rgba(224,36,102,0.28)"><img src="'+SA_P5+'" alt="Integrante do div-a de cabelo ondulado sorrindo" style="position:absolute;left:1271px;top:640px;width:250px;height:320px;object-fit:cover;border-radius:28px;border:5px solid #FFFFFF;box-shadow:0 16px 36px rgba(224,36,102,0.28)"><img src="'+SA_P6+'" alt="Integrante do div-a de cabelo cacheado sorrindo" style="position:absolute;left:1542px;top:580px;width:250px;height:320px;object-fit:cover;border-radius:28px;border:5px solid #FFFFFF;box-shadow:0 16px 36px rgba(224,36,102,0.28)"></div>'},
 {kind:'subarea',theme:'diva',title:'600+ inscritas em três trilhas',html:'<div class="sdk-sec" id="minicurso" data-transition="fade" style="background:#FDEFF5;color:#2B0F1C;font-family:\'Poppins\', Arial, sans-serif;padding:210px 128px 130px;display:flex;flex-direction:column;justify-content:center;gap:10px"><img src="'+SA_BG_DIVA+'" alt="" style="position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover"><img src="'+SA_LOGO+'" alt="Logo do coletivo div-a" style="width:380px;height:66px;object-fit:contain"><p style="font-size:24px;font-weight:700;letter-spacing:6px;color:#E02466;text-transform:uppercase;width:820px">Minicurso 5.0</p><p style="font-size:210px;font-weight:700;line-height:1;color:#E02466;width:820px">600+</p><h2 style="font-size:60px;font-weight:700;line-height:1.1;width:820px">inscritas em <span style="color:#FF6A13">três trilhas</span></h2><p style="font-size:30px;line-height:1.4;color:#5A2A40;width:780px">Um espaço para aprender tecnologia junto, organizado pelo <b>&lt;div&gt;a</b>, o coletivo de mulheres de dados e desenvolvimento do CITi.</p><img src="'+SA_GROUP+'" alt="Seis integrantes do div-a sorrindo, de camiseta branca com o logo do coletivo" style="position:absolute;left:992px;top:300px;width:800px;height:533px;object-fit:cover;border-radius:24px;border:4px solid #FFFFFF"></div>'},
 {kind:'subarea',theme:'diva',title:'Uma formação, três pontos de partida',html:'<div class="sdk-sec" id="trilhas" data-transition="fade" style="background:#FDEFF5;color:#2B0F1C;font-family:\'Poppins\', Arial, sans-serif;padding:190px 128px 120px;display:flex;flex-direction:column;justify-content:center;gap:30px"><img src="'+SA_BG_DIVA+'" alt="" style="position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover"><img src="'+SA_LOGO+'" alt="Logo do coletivo div-a" style="position:absolute;left:1432px;top:200px;width:360px;height:62px;object-fit:contain"><div style="display:flex;flex-direction:column;gap:12px"><p style="font-size:24px;font-weight:700;letter-spacing:6px;color:#E02466;text-transform:uppercase;width:1200px">Minicurso 5.0 · Formação</p><h2 style="font-size:60px;font-weight:700;line-height:1.1;width:1260px">Uma formação, <span style="color:#E02466">três pontos de partida</span></h2></div><p style="font-size:30px;line-height:1.4;color:#5A2A40;width:1300px">Do primeiro contato com a web às tecnologias que sustentam soluções complexas, cada trilha leva a participante um passo além.</p><div style="display:flex;flex-direction:row;gap:24px"><div style="flex:1;display:flex;flex-direction:column;gap:12px;background:rgba(255,255,255,0.82);border:2px solid rgba(224,36,102,0.3);border-radius:24px;padding:32px 32px"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#E02466" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><p style="font-size:22px;font-weight:700;letter-spacing:3px;color:#E02466;text-transform:uppercase">Trilha 1 · Fundamentos</p><p style="font-size:40px;font-weight:700;line-height:1.1">Web básico</p><p style="font-size:26px;line-height:1.4;color:#5A2A40">Como a web funciona e os primeiros passos para construir páginas.</p><div style="display:fle function aspSteps(l){return l.steps.filter(x=>x.kind!=='lesson'||(l.id===12&&x.title==='O que você aprendeu'));}
function trainSteps(l){
  const out=l.id===1?[{kind:'opening'},...SUBAREA_SLIDES,TOOLS_SLIDE,{kind:'cover'}]:[{kind:'cover'}];
  l.steps.forEach(s=>{
    if(s.kind==='story'||s.kind==='quiz'||s.kind==='order'||s.bonus)return;
    if(s.kind==='blocks'&&!(l.id===1&&/repetir/.test(s.title)))return;
    if((s.kind==='code'||s.kind==='tscheck')&&l.id!==6&&l.id!==11)return;
    if((l.id===6&&/^Desafio [34]/.test(s.title))||(l.id===11&&/^Desafio [23]/.test(s.title)))return;
    if(s.kind==='lesson'){(SL[s.title]||[]).forEach(x=>out.push(x));return;}
    out.push(s);});
  if(l.id===LV.length)out.push({kind:'ending'});
  return out;
}
function rCover(s,st){
  const l=cur.L;
  st.innerHTML='<article class="card slide cover"><div class="cv-big" aria-hidden="true">'+l.id+'</div><div class="cv-txt"><span class="sv-num">Bloco '+l.block+' · Tópico '+l.id+' de '+LV.length+'</span><h2>'+acc(l.title)+'</h2><p class="cv-sub">'+l.desc+'</p><div class="cv-journey" aria-hidden="true">'+LV.map(x=>'<i class="'+(x.id<l.id?'past':x.id===l.id?'now':'')+'"></i>').join('')+'</div></div></article>';
}
function rOpening(s,st){
  st.innerHTML='<article class="card slide open"><div class="op-txt"><div class="op-top"><span class="op-logo"><img src="'+LOGO_W+'" alt="CITi" height="34"></span><span class="op-tag">Processo Seletivo</span></div><h1>Lógica de Programação<em>JavaScript e TypeScript</em></h1><p class="op-sub">Do primeiro algoritmo ao seu primeiro código tipado.</p><div class="cv-journey" aria-hidden="true">'+LV.map(()=>'<i></i>').join('')+'</div></div></article>';
}
function rEnding(s,st){
  st.innerHTML='<article class="card slide open end"><div class="op-txt"><span class="op-tag">Fechamento</span><h1><span class="acc">Dúvidas?</span></h1><p class="op-sub">Para praticar mais, use o modo Aspirante: exercícios, desafios bônus e conquistas.</p></div></article>';
}
function rSlide(s,st){
  st.innerHTML='<article class="card slide"><span class="stag">'+(s.kicker||'Conceito')+'</span><h2>'+acc(s.title)+'</h2><div class="sv-body">'+s.html+(s.live==='ts'?tsBox():s.live?labBox('',6,'Código ao vivo'):'')+'</div></article>';
  if(s.live==='ts')mountTsBox(st);else if(s.live)mountLabBox(st,'');
}
function rRecap(s,st){
  st.innerHTML='<article class="card slide"><span class="stag">Resumo</span><h2>O que levar daqui</h2><div class="sv-recap">'+s.items.map((x,i)=>rv('<div class="rc"><i>'+(i+1)+'</i><div><b>'+x[0]+'</b><span>'+x[1]+'</span></div></div>')).join('')+'</div></article>';
}

function renderHud(){
  try{setArt(cur&&view==='level'?cur.L.id:0);}catch(e){}
  const r=rank();document.body.dataset.mode=S.mode;document.body.classList.remove('big');
  const hearts=cur&&view==='level'&&!TR()?'<span class="hearts" aria-label="'+cur.hearts+' vidas">'+[1,2,3].map(i=>heart(i<=cur.hearts)).join('')+'</span>':'';
  const xp=TR()?'':'<span class="pill" title="'+r.name+'"><span>'+S.xp+' XP</span><span class="xpbar"><i style="width:'+Math.round(r.pct*100)+'%"></i></span></span>';
  const IC_LAB='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2.2h12.4a1.5 1.5 0 0 0 1.3-2.2L14 9V3"/><path d="M7.5 15h9"/></svg>';
  $('#hud').innerHTML='<i class="brk"></i><div class="stats">'+hearts+xp+'</div><div class="tools"><button class="tbtn" id="labbtn" title="Laboratório de código" aria-label="Laboratório de código">'+IC_LAB+'<span>Laboratório</span></button></div>'
   +'<div class="msw" role="group" aria-label="Modo"><button class="modebtn" data-m="asp" aria-pressed="'+!TR()+'">Aspirante</button><button class="modebtn" data-m="train" aria-pressed="'+TR()+'">Treinamento</button></div>';
  $('#labbtn').onclick=renderLabView;
  $$('.msw button').forEach(b=>b.onclick=()=>{if(S.mode===b.dataset.m)return;S.mode=b.dataset.m;save();renderMap();});
}


/* ============ mapa do Aspirante ============ */
function worldMap(first){
  const W=800,H=1700;
  const pts=LV.map((l,i)=>({x:i%2?580:220,y:170+i*120,l}));
  const route=[{x:400,y:50}].concat(pts,[{x:400,y:1640}]);
  let d='M'+route[0].x+' '+route[0].y;
  for(let i=0;i<route.length-1;i++){const p0=route[Math.max(0,i-1)],p1=route[i],p2=route[i+1],p3=route[Math.min(route.length-1,i+2)];
    d+=' C'+(p1.x+(p2.x-p0.x)/6).toFixed(1)+' '+(p1.y+(p2.y-p0.y)/6).toFixed(1)+','+(p2.x-(p3.x-p1.x)/6).toFixed(1)+' '+(p2.y-(p3.y-p1.y)/6).toFixed(1)+','+p2.x+' '+p2.y;}
  const checkSvg='<svg viewBox="0 0 24 24" width="48%" height="48%" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';
  const bg='<svg class="wm-bg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><defs>'
   +'<pattern id="wmDots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="currentColor"/></pattern></defs>'
   +'<rect class="wground" width="'+W+'" height="'+H+'"/><rect class="wdots" width="'+W+'" height="'+H+'" fill="url(#wmDots)"/>'
   +'<path class="wpath0" d="'+d+'"/><path class="wpath" d="'+d+'"/></svg>';
  const sign=(y,t,left)=>'<div class="wsign'+(left?' wleft':'')+'" style="top:'+(y/H*100).toFixed(2)+'%"><b>'+t+'</b></div>';
  const nodes=pts.map(p=>{const l=p.l,dn=S.done[l.id],nx=first&&first.id===l.id;
    return '<button class="wn '+(dn?'done':nx?'next':'')+' '+(p.x<400?'l':'r')+'" style="left:'+(p.x/W*100).toFixed(2)+'%;top:'+(p.y/H*100).toFixed(2)+'%" data-id="'+l.id+'" aria-label="'+l.id+'. '+l.title+'">'
     +'<span class="wc">'+(dn?checkSvg:l.id)+'</span><span class="wl"><b>'+l.title+'</b>'+(dn?stars(dn):'')+'</span></button>';}).join('');
  return '<div class="wmap">'+bg+sign(112,'Bloco 1 · Lógica e fundamentos')+sign(840,'Bloco 2 · Dados e TypeScript',true)+nodes+'<div class="wend">Trilha concluída</div></div>';
}
function hhmm(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function renderMap(){
  document.body.classList.remove('diva-on');
  clearInterval(cur&&cur.exT);view='map';cur=null;clearInterval(tick);document.body.dataset.sky='day';delete document.body.dataset.lv;renderHud();
  window.scrollTo(0,0);
  if(TR())return mapTrain();
  const first=LV.find(l=>!S.done[l.id]);
  const nb=Object.keys(S.badges||{}).length;
  app.innerHTML='<div class="hero"><div class="txt"><span class="tag">Modo Aspirante</span><h1>'+acc('Lógica de Programação')+'</h1><p>Pratique o que viu no treinamento: quebra-cabeças, quizzes e desafios de código, com bônus e conquistas. O conteúdo está no modo Treinamento. Em cada nível, use <b>Rever o conteúdo</b> se precisar.</p><div class="row"><button class="btn" id="go">'+(first?(S.xp?'Continuar: '+first.title:'Começar'):'Rever')+'</button><button class="btn ghost" id="labgo">Laboratório de código</button></div></div></div>'
   +worldMap(first)
   +'<section class="block"><div class="bhead"><div><h3>Conquistas</h3><small>'+nb+' de '+BADGES.length+' desbloqueadas</small></div></div><div class="badges">'
   +BADGES.map(b=>'<div class="badge '+(S.badges[b.id]?'on':'')+'"><b>'+(S.badges[b.id]?'★ ':'☆ ')+b.name+'</b><span>'+b.desc+'</span></div>').join('')+'</div></section>'
   +'<p class="foot-note">Seu progresso fica salvo neste navegador. <button class="btn ghost small" id="reset">Zerar progresso</button></p>';
  $$('.wn').forEach(n=>n.onclick=()=>startLevel(+n.dataset.id));
  $('#go').onclick=()=>startLevel((first||LV[0]).id);$('#labgo').onclick=renderLabView;
  const nx=$('.wn.next');if(nx&&first&&S.xp)setTimeout(()=>nx.scrollIntoView({block:'center',behavior:'smooth'}),150);
  let sure=false;$('#reset').onclick=function(){if(!sure){sure=true;this.textContent='Clique de novo para confirmar';return;}S=Object.assign(S,{xp:0,got:{},done:{},badges:{}});save();renderMap();};
}
function mapTrain(){
  const tot=LV.reduce((a,l)=>a+minsOf(l),0);
  const blk=(b,title,sub)=>{return '<section class="block"><div class="bhead"><div><h3>'+title+'</h3><small>'+sub+'</small></div></div><ol class="trail">'
   +LV.filter(l=>l.block===b).map(l=>{let t=0;for(const x of LV){if(x.id===l.id)break;t+=minsOf(x);}const ini=hhmm(toMin(S.tstart)+t);
     return '<li><button class="node" data-id="'+l.id+'"><span class="n">'+l.id+'</span><span class="info"><b>'+l.title+'</b><span>'+l.desc+'</span></span><span class="meta"></span></button></li>';}).join('')+'</ol></section>';};
  app.innerHTML='<div class="hero"><div class="txt"><span class="tag">Modo Treinamento</span><h1>'+acc('Roteiro da aula')+'</h1><p>Apresentação contínua: avance com a seta → ou a barra de espaço e os tópicos se encadeiam sozinhos.</p><div class="row"><button class="btn" id="go">Começar a apresentação</button><button class="btn ghost" id="labgo">Laboratório de código</button></div></div></div>'
   +blk(1,'Bloco 1: Lógica e fundamentos de JS','Apresentador A')+blk(2,'Bloco 2: Estruturas de dados e TypeScript','Apresentador B');
  $$('.node').forEach(n=>n.onclick=()=>startLevel(+n.dataset.id));
  $('#go').onclick=()=>startLevel(1);$('#labgo').onclick=renderLabView;
}
const toMin=t=>{const a=(t||'19:00').split(':');return (+a[0])*60+(+a[1]||0);};

function startLevel(id,toEnd,fresh){
  const l=LV.find(x=>x.id===id);
  cur={L:l,steps:TR()?trainSteps(l):aspSteps(l),idx:0,hearts:3,ok:{},tries:{},sec:minsOf(l)*60,run:false};
  if(toEnd){cur.idx=cur.steps.length-1;cur.back=true;}
  else if(!fresh&&!TR()&&S.pos&&S.pos.L===id&&S.pos.idx>0&&S.pos.idx<cur.steps.length){cur.idx=S.pos.idx;}
  view='level';renderHud();
  app.innerHTML='<div class="lvwrap" id="lvhead"></div><section id="stage"></section><nav class="foot"><button class="btn ghost" id="prev">Voltar</button><button class="btn" id="next">Continuar</button></nav>';
  $('#prev').onclick=()=>go(-1);$('#next').onclick=()=>go(1);
  renderLevelChrome();renderStep();window.scrollTo(0,0);
}
function renderLevelChrome(){
  if(!cur)return;clearInterval(tick);
  const cls=TR();
  document.body.dataset.sky='day';document.body.dataset.lv=cur.L.id;
  $('#lvhead').innerHTML='<div class="lvbar"><button class="back" id="bk" aria-label="Voltar ao mapa">←</button><h1>'+cur.L.id+'. '+esc(cur.L.title)+'</h1>'
   +'</div><div class="phases" id="phases"></div><div class="dots" id="dots"></div>';
  $('#bk').onclick=renderMap;
  if(!cls){const rb=document.createElement('button');rb.className='btn ghost small';rb.id='rev';rb.innerHTML='Rever<span> o conteúdo</span>';rb.onclick=()=>{S.mode='train';save();startLevel(cur.L.id);};$('.lvbar').appendChild(rb);}
  drawDots();
}
function drawDots(){const d=$('#dots');if(!d)return;
  if(TR()){DL=DL||LV.map(l=>trainSteps(l).length);let b=0;for(const l of LV){if(l.id===cur.L.id)break;b+=DL[l.id-1];}const tot=DL.reduce((a,x)=>a+x,0);d.innerHTML='<div class="gbar"><i style="width:'+Math.round((b+cur.idx+1)/tot*100)+'%"></i></div>';return;}
  d.innerHTML=cur.steps.map((s,i)=>'<i class="'+(i===cur.idx?'now':cur.ok[i]||i<cur.idx?'on':'')+'"></i>').join('');
  const el=$('#phases');if(!el)return;const order=[];cur.steps.forEach(x=>{const p=phaseOf(x);if(!order.includes(p))order.push(p);});
  const ni=order.indexOf(phaseOf(cur.steps[cur.idx]));el.innerHTML=order.map((p,k)=>'<span class="'+(k===ni?'on':k<ni?'past':'')+'">'+PH[p]+'</span>').join('');}
function ribbon(){const steps=cur.steps,ph=phaseOf(steps[cur.idx]);const same=steps.map((x,i)=>[x,i]).filter(x=>phaseOf(x[0])===ph);const k=same.findIndex(x=>x[1]===cur.idx)+1;
  return '<div class="ribbon '+ph+'"><b>'+PH[ph]+'</b><span>'+k+' de '+same.length+'</span><em>'+PHDESC[ph]+'</em></div>';}
function passable(i){const s=cur.steps[i];return TR()||s.bonus||s.kind==='lesson'||s.kind==='story'||cur.ok[i];}
function syncFoot(){
  if(!cur||view!=='level')return;
  const last=cur.idx===cur.steps.length-1;
  $('#prev').disabled=cur.idx===0&&!(TR()&&cur.L.id>1);
  const n=$('#next');n.textContent=TR()?($('#stage .rv.off')?'Mostrar':'Continuar'):last?'Concluir nível':'Continuar';n.disabled=TR()?(last&&cur.L.id===LV.length&&!$('#stage .rv.off')):!passable(cur.idx);
  drawDots();
}
function go(d){
  if(!cur)return;
  if(d>0&&!passable(cur.idx))return;
  if(TR()&&d>0){const h=$('#stage .rv.off');if(h){h.classList.remove('off');syncFoot();return;}}
  cur.back=d<0;

const ED_OPEN={'(':')','[':']','{':'}'},ED_CLOSE=new Set([')',']','}']),ED_QUOTE=new Set(['"',"'",'`']);
function wireEditor(ed,onRun){
  const wrap=document.createElement('div');wrap.className='ed-wrap';
  ed.parentNode.insertBefore(wrap,ed);
  wrap.insertAdjacentHTML('afterbegin','<pre class="ed-hl code" aria-hidden="true"><code></code></pre>');
  wrap.appendChild(ed);
  const hlCode=$('code',wrap),hlPre=$('.ed-hl',wrap);
  const paint=()=>{hlCode.innerHTML=hl(ed.value)+'\n';hlPre.scrollTop=ed.scrollTop;hlPre.scrollLeft=ed.scrollLeft;};
  const sync=()=>{hlPre.scrollTop=ed.scrollTop;hlPre.scrollLeft=ed.scrollLeft;};
  ed.addEventListener('input',paint);
  ed.addEventListener('scroll',sync);
  ed.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){if(onRun){e.preventDefault();onRun();}return;}
    if(e.key==='Tab'){
      e.preventDefault();const a=ed.selectionStart,b=ed.selectionEnd;
      ed.value=ed.value.slice(0,a)+'  '+ed.value.slice(b);ed.selectionStart=ed.selectionEnd=a+2;paint();return;
    }
    if(!e.ctrlKey&&!e.metaKey&&!e.altKey){
      const k=e.key,v=ed.value,a=ed.selectionStart,b=ed.selectionEnd;
      if(ED_OPEN[k]){
        e.preventDefault();const close=ED_OPEN[k];
        ed.value=v.slice(0,a)+k+v.slice(a,b)+close+v.slice(b);
        ed.selectionStart=a+1;ed.selectionEnd=a+1+(b-a);paint();return;
      }
      if(ED_QUOTE.has(k)){
        e.preventDefault();
        if(a!==b){ed.value=v.slice(0,a)+k+v.slice(a,b)+k+v.slice(b);ed.selectionStart=a+1;ed.selectionEnd=b+1;}
        else if(v[a]===k){ed.selectionStart=ed.selectionEnd=a+1;}
        else{ed.value=v.slice(0,a)+k+k+v.slice(a);ed.selectionStart=ed.selectionEnd=a+1;}
        paint();return;
      }
      if(ED_CLOSE.has(k)&&a===b&&v[a]===k){e.preventDefault();ed.selectionStart=ed.selectionEnd=a+1;return;}
    }
    if(e.key==='Backspace'){
      const v=ed.value,a=ed.selectionStart,b=ed.selectionEnd;
      if(a===b&&a>0&&ED_OPEN[v[a-1]]===v[a]){
        e.preventDefault();ed.value=v.slice(0,a-1)+v.slice(a+1);ed.selectionStart=ed.selectionEnd=a-1;paint();return;
      }
    }
    if(e.key==='Enter'){
      e.preventDefault();const pos=ed.selectionStart,v=ed.value;
      const lineStart=v.lastIndexOf('\n',pos-1)+1,line=v.slice(lineStart,pos);
      const indent=(line.match(/^[ \t]*/)||[''])[0],trimmed=line.trim();
      const opens='{[(',closes='}])',lastCh=trimmed.slice(-1),oIdx=opens.indexOf(lastCh);
      const extra=oIdx>=0?'  ':'';
      if(oIdx>=0&&v[pos]===closes[oIdx]){
        const insert='\n'+indent+extra+'\n'+indent;
        ed.value=v.slice(0,pos)+insert+v.slice(pos);ed.selectionStart=ed.selectionEnd=pos+1+indent.length+extra.length;
      }else{
        const insert='\n'+indent+extra;
        ed.value=v.slice(0,pos)+insert+v.slice(pos);ed.selectionStart=ed.selectionEnd=pos+insert.length;
      }
      paint();
    }
  });
  paint();
  return paint;
}

  const tpls=arr=>arr.map(b=>'<div class="tplwrap">'+blk({t:b,body:[],els:[]},true)+'</div>').join('');
  st.innerHTML='<article class="card"><h2>'+s.title+'</h2>'+coach(s.who,s.mood,s.say)+'<p>'+s.task+'</p>'
   +'<div class="stagebar"><div class="board-wrap"><div class="board" id="bd" style="--cols:'+cols+'">'+cells+'<div class="actor" id="ac" style="--r:'+start.r+';--c:'+start.c+';--dir-deg:'+DDEG[start.d]+'deg">'+actorIcon()+'</div></div></div>'
   +'<div class="runbox"><button class="btn" id="go">▶ Executar</button><button class="btn ghost small" id="clr">Limpar</button><button class="btn ghost small" id="hint">Dica</button><span id="cnt" class="tchip"></span></div></div>'
   +'<p class="muted">Arraste os blocos da esquerda e encaixe embaixo de "quando ▶ for clicado". Para apagar, arraste o bloco de volta para a paleta.</p>'
   +'<div class="build"><aside class="palette2" id="pal"><h4>Blocos</h4>'+(motion.length?'<div class="cat">Movimento</div>'+tpls(motion):'')+(control.length?'<div class="cat ctl">Controle</div>'+tpls(control):'')+'</aside><div class="ws" id="ws"></div></div>'
   +'<div id="fb"></div><div id="jswrap" hidden><p><b>Seu programa em JavaScript:</b></p><pre class="code" id="js"></pre></div></article>';
  const ac=$('#ac',st),fb=$('#fb',st),ws=$('#ws',st),pal=$('#pal',st);
  let curDeg=DDEG[start.d];
  const place=(r,c,d)=>{ac.style.setProperty('--r',r);ac.style.setProperty('--c',c);const delta=(((DDEG[d]-curDeg)%360+540)%360)-180;curDeg+=delta;ac.style.setProperty('--dir-deg',curDeg+'deg');};
  const getList=id=>{if(id==='root')return P;const p=id.split(':'),n=findNode(P,+p[0]);return n?n[p[1]]:P;};
  function info(){
    const n=countB(P);$('#cnt',st).textContent='Blocos: '+n+' / '+s.max;$('#cnt',st).className='tchip'+(n>s.max?' over':'');
    $('#jswrap',st).hidden=!P.length;$('#js',st).innerHTML=hl(toJs(P));
  }
  function refresh(){
    ws.innerHTML='<div class="wsin"><div class="sb hat" id="hat"><span>quando</span><i class="flag">▶</i><span>for clicado</span></div><div class="list stack" data-list="root">'+P.map(n=>blk(n,false)).join('')+'</div></div>';
    info();
  }
  /* ---- arrastar e soltar ---- */
  const dropline=document.createElement('div');dropline.className='dropline';dropline.hidden=true;document.body.appendChild(dropline);
  function pickTarget(gx,gy){
    let best=null;
    $$('[data-list]',ws).forEach(el=>{
      const r=el.getBoundingClientRect(),kids=[...el.children].filter(c=>c.dataset.bid),pts=[];
      kids.forEach((k,ix)=>pts.push({i:ix,y:k.getBoundingClientRect().top}));
      pts.push({i:kids.length,y:kids.length?kids[kids.length-1].getBoundingClientRect().bottom:r.top});
      pts.forEach(p=>{const d=Math.hypot((r.left-gx)*.7,p.y-gy);if(!best||d<best.d)best={d:d,listId:el.dataset.list,index:p.i,x:r.left,y:p.y};});
    });
    return best;
  }
  const overWs=(x,y)=>{const r=ws.getBoundingClientRect();return x>=r.left-10&&x<=r.right+10&&y>=r.top-10&&y<=r.bottom+10;};
  function cleanupDrag(){window.removeEventListener('pointermove',onMove);window.removeEventListener('pointerup',onUp);window.removeEventListener('pointercancel',onCancel);dropline.hidden=true;pal.classList.remove('trash');if(drag&&drag.ghost)drag.ghost.remove();}
  function onDown(e){
    if(busy||(e.button&&e.button!==0))return;
    if(e.target.closest('input')||e.target.closest('.dragghost'))return;
    const t=e.target.closest('[data-tpl]'),b=e.target.closest('[data-bid]'),el=t||b;
    if(!el||!st.contains(el))return;
    const r=el.getBoundingClientRect();
    drag={tpl:t?t.dataset.tpl:null,bid:(!t&&b)?+b.dataset.bid:null,sx:e.clientX,sy:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,w:r.width,started:false,stack:null,ghost:null,tgt:null};
    window.addEventListener('pointermove',onMove);window.addEventListener('pointerup',onUp);window.addEventListener('pointercancel',onCancel);
    e.preventDefault();
  }
  function begin(){
    drag.started=true;
    if(drag.tpl)drag.stack=[mk(drag.tpl)];
    else{const loc=locate(P,drag.bid);drag.stack=loc.list.splice(loc.index);refresh();}
    const gh=document.createElement('div');gh.className='dragghost list';gh.style.width=Math.max(drag.w,120)+'px';
    gh.innerHTML=drag.stack.map(n=>blk(n,false)).join('');
    gh.querySelectorAll('[data-list],[data-bid],[tabindex]').forEach(x=>{x.removeAttribute('data-list');x.removeAttribute('data-bid');x.removeAttribute('tabindex');});
    document.body.appendChild(gh);drag.ghost=gh;
  }
  function onMove(e){
    if(!drag)return;
    if(!drag.started){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6)return;begin();}
    const gx=e.clientX-drag.ox,gy=e.clientY-drag.oy;
    drag.ghost.style.left=gx+'px';drag.ghost.style.top=gy+'px';
    if(overWs(e.clientX,e.clientY)){drag.tgt=pickTarget(gx,gy);pal.classList.remove('trash');
      if(drag.tgt){dropline.hidden=false;dropline.style.left=drag.tgt.x+'px';dropline.style.top=(drag.tgt.y-2)+'px';dropline.style.width=Math.max(70,drag.w)+'px';}}
    else{drag.tgt=null;dropline.hidden=true;if(drag.bid!=null)pal.classList.add('trash');}
  }
  function onUp(e){
    const d=drag;cleanupDrag();drag=null;if(!d)return;
    if(!d.started){if(d.tpl){P.push(mk(d.tpl));refresh();}return;}
    if(d.tgt)getList(d.tgt.listId).splice(d.tgt.index,0,...d.stack);
    refresh();
  }
  function onCancel(){const d=drag;cleanupDrag();drag=null;if(d&&d.started&&d.bid!=null)P.push(...d.stack);refresh();}
  st.addEventListener('pointerdown',onDown);
  st.addEventListener('keydown',e=>{
    const t=e.target.closest('[data-tpl]'),b=e.target.closest('[data-bid]');
    if((e.key==='Enter'||e.key===' ')&&t&&e.target===t){e.preventDefault();P.push(mk(t.dataset.tpl));refresh();}
    if((e.key==='Delete'||e.key==='Backspace')&&b&&e.target===b){e.preventDefault();removeNode(P,+b.dataset.bid);refresh();}
  });
  ws.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.n){const n=findNode(P,+t.dataset.n);if(n){n.n=Math.max(1,Math.min(12,+t.value||1));info();}}});
  $('#clr',st).onclick=()=>{if(busy)return;P.length=0;refresh();place(start.r,start.c,start.d);fb.innerHTML='';};
  $('#hint',st).onclick=()=>{fb.innerHTML='<div class="fb info">Dica: '+s.hint+'</div>';};
  function endRun(sim){
    busy=false;
    if(sim.status==='goal'){const first=!cur.tries[i];award('b'+cur.L.id+'-'+i,first?30:20);fb.innerHTML='<div class="fb good">Chegou ao destino! '+s.why+'</div>';markOk();}
    else{cur.tries[i]=(cur.tries[i]||0)+1;const m={wall:'Bateu na parede. Confira onde ele vira.',limit:'O programa não termina (passos demais). Confira os blocos de repetição.',end:'O programa acabou sem chegar ao destino. Faltou algum passo?'}[sim.status];fb.innerHTML='<div class="fb bad">'+m+'</div>';}
  }
  function run(){
    if(busy)return;
    if(!P.length){fb.innerHTML='<div class="fb info">Monte um programa primeiro: arraste blocos para baixo de "quando ▶ for clicado".</div>';return;}
    if(countB(P)>s.max){fb.innerHTML='<div class="fb bad">Programa grande demais: use no máximo '+s.max+' blocos. Algum bloco de repetição ou de decisão ajuda?</div>';return;}
    const sim=simulate(P,g,start);busy=true;place(start.r,start.c,start.d);fb.innerHTML='';let k=0;
    const stepAnim=()=>{if(!cur||cur.idx!==i||view!=='level'){busy=false;return;}k++;
      if(k<sim.trace.length){const t=sim.trace[k];place(t.r,t.c,t.d);if(t.ev==='bump'){ac.classList.add('bump');setTimeout(()=>ac.classList.remove('bump'),320);}cur.pzT=setTimeout(stepAnim,340);}
      else endRun(sim);};
    cur.pzT=setTimeout(stepAnim,250);
  }
  $('#go',st).onclick=run;
  ws.addEventListener('click',e=>{if(e.target.closest('#hat'))run();});
  if(cur.ok[i])fb.innerHTML='<div class="fb good">Quebra-cabeça resolvido! Pode testar outras ideias.</div>';
  cur.pz={P:P,refresh:refresh,run:run};
  refresh();
}

function finish(){
  const l=cur.L;S.pos=null;save();clearInterval(tick);clearInterval(cur.exT);
  const nextL=LV.find(x=>x.id===l.id+1);
  if(TR()){
    view='done';renderHud();
    app.innerHTML='<article class="card finish"><h2>Tópico concluído</h2><p>'+esc(l.title)+'</p><div class="row">'+(nextL?'<button class="btn" id="nx">Próximo: '+esc(nextL.title)+'</button>':'')+'<button class="btn ghost" id="mp">Voltar ao roteiro</button></div></article>';
    if(nextL)$('#nx').onclick=()=>startLevel(nextL.id);
    $('#mp').onclick=renderMap;cur=null;window.scrollTo(0,0);return;
  }
  const n=Math.max(1,cur.hearts);
  S.done[l.id]=Math.max(S.done[l.id]||0,n);award('lvl'+l.id,20);save();
  const had=Object.assign({},S.badges);checkBadges();
  const newB=BADGES.filter(b=>S.badges[b.id]&&!had[b.id]);
  view='done';renderHud();
  app.innerHTML='<article class="card finish"><h2>'+(l.id===12?'Tudo completo!':'Nível completo!')+'</h2><p>'+esc(l.title)+' concluído.</p>'+stars(n)
   +(newB.length?'<div class="newb">'+newB.map(b=>'<span>★ '+b.name+'</span>').join('')+'</div>':'')
   +'<p><b>'+S.xp+' XP</b> no total · '+rank().name+'</p><div class="row">'+(nextL?'<button class="btn" id="nx">Próximo nível</button>':'')+'<button class="btn ghost" id="mp">Voltar ao mapa</button></div></article>';
  if(nextL)$('#nx').onclick=()=>startLevel(nextL.id);
  $('#mp').onclick=renderMap;cur=null;view='done';window.scrollTo(0,0);
}

let DL=null,fitMO=null,fitRaf=0;
function watchFit(w){if(fitMO)fitMO.disconnect();fitMO=new MutationObserver(()=>{cancelAnimationFrame(fitRaf);fitRaf=requestAnimationFrame(fitSlide);});fitMO.observe(w,{childList:true,subtree:true,characterData:true});}
function fitSlide(){
  if(!TR()||view!=='level'||!cur)return;
  const card=$('#stage > article.slide'),inner=card&&card.querySelector('.fit');if(!inner)return;
  const foot=$('.foot');
  const top=card.getBoundingClientRect().top+window.scrollY;
  const avail=Math.max(240,window.innerHeight-top-(foot&&!foot.hidden?foot.offsetHeight+18:0)-14);
  inner.style.transform='';inner.style.width='';inner.style.minHeight='';
  card.style.height=avail+'px';
  const cs=getComputedStyle(card);const availH=avail-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  if(card.querySelector('.build')){
    const natural=inner.scrollHeight;const kk=Math.min(1,(availH-6)/natural);
    if(kk<.999){inner.style.transform='scale('+kk+')';inner.style.transformOrigin='top center';inner.style.minHeight=(availH/kk)+'px';}
    card.style.overflow='hidden';return;
  }
  let k=1;
  const origin=(card.classList.contains('cover')||card.classList.contains('open'))?'left center':'top left';
  const test=kk=>{inner.style.width=(100/kk)+'%';inner.style.transform='scale('+kk+')';inner.style.transformOrigin=origin;return inner.scrollHeight*kk<=availH-18;};
  if(!test(1)){let lo=.35,hi=1;for(let i=0;i<10;i++){const mid=(lo+hi)/2;if(test(mid))lo=mid;else hi=mid;}k=lo;test(k);}
  else{let lo=1,hi=1.3;for(let i=0;i<8;i++){const mid=(lo+hi)/2;if(test(mid))lo=mid;else hi=mid;}k=lo;test(k);}
  if(Math.abs(k-1)<.01){inner.style.transform='';inner.style.width='';k=1;}
  inner.style.minHeight=(availH/k)+'px';
  card.style.overflow=k<=.36?'auto':'hidden';
}
window.addEventListener('resize',()=>{cancelAnimationFrame(fitRaf);fitRaf=requestAnimationFrame(fitSlide);});
$('#home').onclick=renderMap;
document.addEventListener('keydown',e=>{
  if(view!=='level'||!cur)return;
  const t=e.target.tagName;if(t==='TEXTAREA'||t==='INPUT'||t==='SELECT')return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(1);}else if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1);
});
renderMap();
</script>
