<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Lógica de Programação — CITi</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Figtree:wght@400;600;800&family=JetBrains+Mono:wght@500;700&family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: trilha de jogo (mapa vertical com dois blocos) + telas de nível em coluna única. Modo aula adiciona cronômetro e navegação por teclado. */
:root{
  --brand:#2ddb60; --brand-deep:#1aa84a; --brand-ink:#04301b;
  --bg:#f1f9f4; --surface:#ffffff; --surface2:#e3f4ea; --line:#c9e3d3;
  --fg:#0a2316; --muted:#4a6757;
  --pink:#ffb1c7; --pink-deep:#e0527f;
  --good:#0c8f4b; --good-bg:#d9f7e5; --bad:#cf2f4c; --bad-bg:#fde3e8; --warn:#9a6200; --warn-bg:#fff0cf;
  --code-bg:#0c2018; --code-fg:#e4f6ea;
  --f-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#06140d; --surface:#0d2117; --surface2:#123122; --line:#1e4a32;
  --fg:#e7f7ed; --muted:#93b8a3;
  --good:#3fe088; --good-bg:#0f3a24; --bad:#ff7a90; --bad-bg:#3d1620; --warn:#ffcb6b; --warn-bg:#3b2d0b;
  --code-bg:#030d08; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#06140d; --surface:#0d2117; --surface2:#123122; --line:#1e4a32;
  --fg:#e7f7ed; --muted:#93b8a3;
  --good:#3fe088; --good-bg:#0f3a24; --bad:#ff7a90; --bad-bg:#3d1620; --warn:#ffcb6b; --warn-bg:#3b2d0b;
  --code-bg:#030d08; color-scheme:dark;}

/* tema escuro fixo (os dois modos) — identidade da EJ (CITi 30 anos), verde técnico, Poppins; rosa substituído por verde em toda a aplicação */
body{
  --brand:#2ddb60 !important; --brand-deep:#1aa84a !important; --brand-ink:#04150a !important;
  --bg:#040906 !important; --surface:#0b1511 !important; --surface2:#101e19 !important; --line:#1c3a2c !important;
  --fg:#f7f9f8 !important; --muted:#93b0a5 !important;
  --pink:#2ddb60 !important; --pink-deep:#1aa84a !important;
  --good:#2ddb60 !important; --good-bg:#102a1c !important; --bad:#ff6b7a !important; --bad-bg:#2a1016 !important; --warn:#ffcb6b !important; --warn-bg:#2a2208 !important;
  --code-bg:#020806 !important; --code-fg:#dff3ea !important;
  --f-display:'Poppins',system-ui,sans-serif !important;
  --f-body:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif !important;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--f-body);min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:30}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
h2{font-size:1.55rem;font-weight:800}
p{margin:.5em 0}
code{font-family:var(--f-mono);font-size:.88em;background:var(--surface2);padding:.1em .38em;border-radius:6px}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pink-deep);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink);box-shadow:0 3px 0 var(--brand-deep)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;border:0;background:none;padding:0;cursor:pointer}
.brand img{height:34px;width:auto;display:block}
.hud{display:contents}
.brk{display:none}
.top .wrap{gap:10px 14px}
.stats{display:flex;align-items:center;gap:10px;margin-left:auto;min-width:0}
.tools{display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.55);border-radius:999px;padding:5px 12px;font:800 .9rem var(--f-display);color:var(--brand-ink);white-space:nowrap}
.xpbar{width:64px;height:8px;border-radius:99px;background:rgba(4,48,27,.2);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--brand-ink);border-radius:99px}
.hearts{display:inline-flex;gap:3px;background:rgba(255,255,255,.55);border-radius:999px;padding:5px 10px}
.hearts svg{width:18px;height:18px}
.tbtn{display:inline-flex;align-items:center;gap:7px;border:0;background:rgba(255,255,255,.55);color:var(--brand-ink);border-radius:999px;height:36px;padding:0 14px 0 11px;font:800 .85rem var(--f-display);cursor:pointer;transition:background .15s,transform .1s}
.tbtn:hover{background:rgba(255,255,255,.85)}.tbtn:active{transform:scale(.96)}
.tbtn svg{width:18px;height:18px;flex:0 0 auto}
.msw{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:rgba(4,48,27,.16)}
.modebtn{border:0;background:transparent;color:var(--brand-ink);border-radius:999px;height:30px;padding:0 14px;font:800 .85rem var(--f-display);cursor:pointer;transition:background .15s,color .15s}
.modebtn[aria-pressed="false"]:hover{background:rgba(255,255,255,.4)}
.modebtn[aria-pressed="true"]{background:var(--brand-ink);color:var(--brand);box-shadow:0 2px 0 rgba(0,0,0,.2)}
@media (max-width:640px){
  .msw{order:2;margin-left:auto}
  .brk{display:block;order:3;flex:0 0 100%;height:0}
  .stats{order:4;margin-left:0;flex:1;min-width:0}
  .tools{order:5}
  .tbtn{width:36px;padding:0;justify-content:center}.tbtn span{display:none}
  .modebtn{padding:0 11px}
}

main{padding-block:22px 80px}

/* botões */
.btn{font:800 1.02rem var(--f-display);border:0;border-radius:14px;padding:11px 22px;background:var(--brand);color:var(--brand-ink);box-shadow:0 12px 26px -14px color-mix(in srgb,var(--brand) 75%,transparent);cursor:pointer;transition:transform .12s,filter .12s,box-shadow .12s}
.btn:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(0);filter:brightness(.97)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.ghost{background:color-mix(in srgb,var(--surface) 90%,transparent);color:var(--fg);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:hover:not(:disabled){border-color:var(--brand);filter:none}
.btn.small{font-size:.9rem;padding:7px 14px;border-radius:12px}
.btn.pink{background:var(--pink);color:var(--brand-ink);box-shadow:0 12px 26px -14px color-mix(in srgb,var(--pink) 75%,transparent)}

/* mapa — hero em estética de slide de capa */
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:color-mix(in srgb,var(--surface) 92%,transparent);border:1px solid color-mix(in srgb,var(--brand) 14%,var(--line));border-radius:28px;padding:26px 28px;margin-bottom:26px;box-shadow:0 20px 48px -30px rgba(0,0,0,.55);background-image:var(--bg-open,none);background-repeat:no-repeat;background-position:right -10% bottom -30%;background-size:min(380px,34%) auto}
.hero .txt{position:relative;z-index:1;flex:1 1 280px;min-width:0}
.hero .txt>.tag{display:inline-block;background:none;color:var(--brand);padding:0;margin:0 0 12px;letter-spacing:.16em}
.hero .txt>.tag::before{content:"";display:block;width:30px;height:3px;border-radius:99px;background:var(--brand);margin-bottom:10px}
.hero h1{font-size:clamp(1.9rem,6vw,2.7rem);font-weight:800}
.hero p{color:var(--muted);font-weight:600;max-width:60ch}
.hero .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 14px;font:800 .9rem var(--f-display);cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.block{margin-bottom:34px}
.bhead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.bhead h3{font-size:1.3rem}
.bhead small{color:var(--muted);font-weight:600;display:block}
.trail{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px;position:relative}
.node{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:color-mix(in srgb,var(--surface2) 55%,transparent);border:1.5px solid var(--line);border-radius:18px;padding:12px 16px;cursor:pointer;transition:transform .12s,border-color .12s}
.node:hover{transform:translateY(-2px);border-color:var(--brand)}
.node .n{flex:0 0 auto;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font:800 1.3rem var(--f-display);background:none;color:var(--brand);border:2px solid var(--line)}
.node.done .n{background:color-mix(in srgb,var(--brand) 16%,var(--surface));border-color:var(--brand);color:var(--brand)}
.node.next{border-color:var(--brand)}
.node.next .n{border-color:var(--brand);box-shadow:0 0 0 5px color-mix(in srgb,var(--brand) 18%,transparent);animation:ringpulse 2s ease-in-out infinite}
.node .info{flex:1;min-width:0}
.node .info b{font:800 1.1rem var(--f-display);display:block}
.node .info span{color:var(--muted);font-size:.92rem}
.node .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto}
.stars{display:flex;gap:2px}
.stars svg{width:18px;height:18px}
.tchip{font:800 .75rem var(--f-display);background:none;border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));color:var(--warn);border-radius:99px;padding:2px 10px;white-space:nowrap}
@media (min-width:640px){.trail .node:nth-child(even){margin-left:36px;width:calc(100% - 36px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,248,125,.55)}50%{box-shadow:0 0 0 10px rgba(0,248,125,0)}}
.summary{background:var(--warn-bg);color:var(--warn);border-radius:16px;padding:10px 16px;font-weight:800;margin-bottom:22px}

/* nível */
.lvhead{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.lvhead .back{border:2px solid var(--line);background:var(--surface);border-radius:12px;width:40px;height:40px;cursor:pointer;font:800 1.2rem var(--f-display)}
.lvhead h1{font-size:1.25rem;font-weight:800;flex:1;min-width:120px}
.dots{display:flex;gap:6px;width:100%;order:5}
.dots i{flex:1;height:10px;border-radius:99px;background:var(--line)}
.dots i.on{background:var(--brand)}
.dots i.now{background:var(--brand-deep)}
.timer{display:flex;align-items:center;gap:8px;background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:4px 6px 4px 12px;font:800 1rem var(--f-display)}
.timer.low{background:var(--bad-bg);color:var(--bad)}
.timer .tnum{font-variant-numeric:tabular-nums;min-width:3.4em}
.card{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:20px}
.card h2{margin-bottom:12px}
.coach{margin-bottom:16px}
.say{position:relative;background:var(--surface2);border-radius:18px;padding:12px 16px;font-weight:600;min-width:0}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-12px) scale(.98,1.03)}}
.foot{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
.lab{background:var(--surface2);border-radius:18px;padding:14px 16px;margin:14px 0}
.lab h4{margin:0 0 8px;font:800 1rem var(--f-display);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.out{font:700 1rem var(--f-mono);background:var(--surface);border:2px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;overflow-x:auto;min-height:2.8em}
.out.err{color:var(--bad);border-color:var(--bad)}
.out.ok{color:var(--good);border-color:var(--good)}
.code{background:var(--code-bg);color:var(--code-fg);border-radius:14px;padding:12px 16px;overflow-x:auto;font:500 .88rem/1.65 var(--f-mono);margin:10px 0;white-space:pre}
.code .t-k{color:#ff9dbb}.code .t-s{color:#8df5b5}.code .t-n{color:#ffd27a}.code .t-c{color:#7f9c8b;font-style:italic}
.code .hl{background:rgba(0,248,125,.22);border-radius:4px}
.ipo{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:stretch}
.ipo .b{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.ipo .b b{font:800 1.05rem var(--f-display)}
.ipo .b span{font-size:.85rem;color:var(--muted)}
.ipo .a{align-self:center;font:800 1.4rem var(--f-display);color:var(--muted)}
@media (max-width:520px){.ipo{grid-template-columns:1fr}.ipo .a{transform:rotate(90deg);justify-self:center}}
input[type=text],input[type=number],select{font:600 1rem var(--f-mono);padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);max-width:100%}
input[type=number]{width:5.5em}
input[type=range]{accent-color:var(--good);width:min(320px,100%)}
.chip{border:1.5px solid var(--line);background:color-mix(in srgb,var(--surface2) 55%,transparent);border-radius:12px;padding:6px 12px;font:700 .95rem var(--f-mono);cursor:pointer;transition:transform .1s,border-color .1s}
.chip:active{transform:translateY(1px)}
.chip.on{background:color-mix(in srgb,var(--brand) 16%,var(--surface));color:var(--brand);border-color:var(--brand)}
.chip:disabled{opacity:.4}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;margin-bottom:10px;border:1.5px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--surface2) 55%,transparent);font:700 1rem var(--f-body);cursor:pointer;transition:border-color .12s,transform .12s}
.opt:hover:not(:disabled){border-color:var(--brand);transform:translateY(-1px)}
.opt.good{border-color:var(--good);background:var(--good-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg);animation:shake .3s}
.opt code{background:transparent;padding:0}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{border-radius:14px;padding:12px 14px;margin-top:6px;font-weight:600}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.info{background:var(--warn-bg);color:var(--warn)}
.tag{display:inline-block;font:800 .75rem var(--f-display);text-transform:uppercase;letter-spacing:.06em;background:var(--pink);color:var(--brand-ink);border-radius:99px;padding:2px 10px;margin-left:8px;vertical-align:middle}
.placed{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.placed div{display:flex;gap:10px;align-items:center;background:var(--good-bg);color:var(--good);border-radius:12px;padding:10px 12px;font-weight:700}
.placed b{font:800 1rem var(--f-display);background:var(--good);color:var(--surface);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
textarea.ed{width:100%;min-height:190px;resize:vertical;background:var(--code-bg);color:var(--code-fg);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font:500 .9rem/1.6 var(--f-mono);tab-size:2}
.tests{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:6px}
.tests li{font:600 .85rem var(--f-mono);padding:7px 10px;border-radius:10px;background:var(--surface2);overflow-wrap:anywhere}
.tests li.p{background:var(--good-bg);color:var(--good)}
.tests li.f{background:var(--bad-bg);color:var(--bad)}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th,.tbl td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line)}
.tbl th{color:var(--muted);font-weight:800}
.tbl td.t{color:var(--good);font-weight:800;font-family:var(--f-mono)}
.tbl td.f{color:var(--bad);font-weight:800;font-family:var(--f-mono)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mini{background:var(--surface2);border-radius:16px;padding:12px 14px;min-width:0}
.mini b{font:800 1rem var(--f-display)}
.mini .code{margin:8px 0 0;font-size:.8rem}
.finish{text-align:center;padding:26px 18px}
.finish .stars{justify-content:center;margin:10px 0}
.finish .stars svg{width:38px;height:38px}
.finish .row{justify-content:center;margin-top:16px}
.check{list-style:none;padding:0;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.check li{display:flex;gap:10px;align-items:center;font-weight:700}
.check i{width:22px;height:22px;border-radius:50%;background:var(--line);flex:0 0 auto;display:grid;place-items:center;color:var(--brand-ink);font-style:normal;font-size:.8rem}
.check li.on i{background:var(--brand)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--brand-ink);color:var(--brand);font:800 1rem var(--f-display);padding:8px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.25s;z-index:40}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot-note{text-align:center;color:var(--muted);font-size:.85rem;margin-top:30px}
/* historinha */
.scene{position:relative;height:210px;border-radius:18px;overflow:hidden;margin-bottom:14px;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(#a6e6ff,#eafff4)}
.scene.dawn{background:linear-gradient(#ff9fbd,#ffe6b8)}
.scene.dusk{background:linear-gradient(#7b6cf0,#ffb7c9)}
.scene.night{background:radial-gradient(#fff 1px,transparent 1.6px) 0 0/38px 38px,linear-gradient(#1f1450,#6a3d9c)}
.scene::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-46px;height:86px;border-radius:50%;background:#62d98f}
.scene.night::after,.scene.dusk::after{background:#23895a}
.scene .sprites{position:relative;z-index:2;display:flex;align-items:flex-end;margin-bottom:-4px}
.sign{position:absolute;right:7%;bottom:44px;z-index:1;background:#d29a5c;color:#3b2208;font:800 .95rem var(--f-display);padding:6px 12px;border-radius:8px;border:3px solid #8a5a2b;transform:rotate(3deg);max-width:42%;text-align:center}
.sign::after{content:"";position:absolute;left:50%;top:100%;width:8px;height:34px;background:#8a5a2b;transform:translateX(-50%)}
.narr{font-size:1.08rem;margin:6px 0}
.speech{display:flex;gap:10px;align-items:baseline;background:var(--surface2);border-radius:16px;padding:10px 14px;font-weight:700;margin-top:12px}
.speech b{font-family:var(--f-display);white-space:nowrap}
/* fases, laboratório e quebra-cabeça de blocos */
.phases{order:4;width:100%;display:flex;gap:6px;flex-wrap:wrap}
.phases span{font:800 .78rem var(--f-display);text-transform:uppercase;letter-spacing:.07em;padding:2px 11px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.phases span.on{background:var(--brand);color:var(--brand-ink)}
.phases span.past{opacity:.6}
.ribbon{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.ribbon b{font:800 .85rem var(--f-display);text-transform:uppercase;letter-spacing:.08em;padding:3px 13px;border-radius:99px}
.ribbon.teoria b{background:var(--brand);color:var(--brand-ink)}
.ribbon.pratica b{background:var(--pink);color:#4a0f26}
.ribbon.historia b{background:var(--warn-bg);color:var(--warn)}
.ribbon.fim b{background:var(--surface2);color:var(--fg)}
.ribbon span{color:var(--muted);font-weight:800;font-size:.9rem}
.ribbon em{font-style:normal;color:var(--muted);font-weight:600;font-size:.9rem;margin-left:auto}
.recap{display:flex;gap:10px;align-items:baseline;background:var(--good-bg);color:var(--good);border-radius:14px;padding:10px 14px;margin-top:14px;font-weight:700}
.recap b{font-family:var(--f-display);white-space:nowrap}
.labbox textarea.ed{min-height:0}
.hintkey{color:var(--muted);font-size:.8rem;font-weight:700}
.tchip.over{background:var(--bad-bg);color:var(--bad)}
.muted{color:var(--muted);font-size:.88rem;margin:6px 0}
.board-wrap{overflow-x:auto;max-width:100%}
.board{--cell:clamp(34px,calc((100vw - 80px) / var(--cols)),58px);position:relative;display:grid;grid-template-columns:repeat(var(--cols),var(--cell));grid-auto-rows:var(--cell);gap:2px;width:max-content;background:var(--line);padding:2px;border-radius:14px}
.cell{background:var(--surface2);border-radius:6px;position:relative}

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ACC_STOP=new Set(['de','da','do','das','dos','em','e','a','o','os','as','um','uma','no','na','nos','nas','com','que','é','ou','para']);
function acc(title){
  const words=String(title).split(' ');
  if(words.length<2)return esc(title);
  let n=1;
  while(n<words.length-1&&ACC_STOP.has(words[words.length-n].toLowerCase()))n++;
  if(n<2&&words.length>4)n=2;
  n=Math.min(n,3,words.length-1);
  const head=words.slice(0,-n).join(' '),tail=words.slice(-n).join(' ');
  return esc(head)+' <span class="acc">'+esc(tail)+'</span>';
}
function hl(src){
  const re=/(\/\/[^\n]*)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(const|let|var|function|return|if|else|for|while|of|in|break|continue|async|await|new|true|false|null|undefined|interface|type|typeof|number|string|boolean|Promise)\b|\b(\d+(?:\.\d+)?)\b/g;
  let out='',last=0,m;
  while((m=re.exec(src))){out+=esc(src.slice(last,m.index));const c=m[1]?'c':m[2]?'s':m[3]?'k':'n';out+='<span class="t-'+c+'">'+esc(m[0])+'</span>';last=re.lastIndex;}
  return out+esc(src.slice(last));
}
const code=(src)=>'<pre class="code"><code>'+hl(src)+'</code></pre>';
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ============ executor de código dos alunos ============ */
async function execTests(p){
  const canon=v=>{if(Array.isArray(v))return v.map(canon);if(v&&typeof v==='object'){const o={};Object.keys(v).sort().forEach(k=>{o[k]=canon(v[k]);});return o;}return v;};
  const sh=v=>v===undefined?'undefined':JSON.stringify(v);
  let f;
  try{f=new Function(p.code+'\nreturn typeof '+p.fn+'==="function"?'+p.fn+':undefined;')();}
  catch(err){const m=String(err);return{error:m,noEval:/unsafe-eval|EvalError|Content Security/i.test(m)};}
  if(!f)return{error:'Não encontrei a função '+p.fn+'. Confira o nome.'};
  const res=[];
  for(const c of p.cases){
    try{const out=await f.apply(null,JSON.parse(JSON.stringify(c.args)));res.push({ok:sh(canon(out))===sh(canon(c.expected)),got:sh(out)});}
    catch(err){res.push({ok:false,got:'erro: '+err.message});}
  }
  return{res};
}
async function execLab(p){
  const logs=[];
  const fmt=a=>{if(a===undefined)return'undefined';if(typeof a==='string')return a;if(typeof a==='function')return String(a);try{return JSON.stringify(a);}catch(e){return String(a);}};
  const push=(pre)=>(...a)=>{logs.push(pre+a.map(fmt).join(' '));};
  const con={log:push(''),info:push(''),warn:push('aviso: '),error:push('erro: ')};
  try{
    const AF=Object.getPrototypeOf(async function(){}).constructor;
    const f=new AF('console',p.code);
    await f(con);
    return{logs};
  }catch(err){const m=String(err);return{logs,error:m,noEval:/unsafe-eval|EvalError|Content Security/i.test(m)};}
}
const WORKER_SRC='const execTests='+execTests.toString()+';const execLab='+execLab.toString()+';onmessage=async e=>{postMessage(e.data.lab?await execLab(e.data):await execTests(e.data));};';
function viaWorker(payload,main,ms,timeoutMsg){
  return new Promise(resolve=>{
    let done=false;const fin=r=>{if(!done){done=true;resolve(r);}};
    try{
      const w=new Worker(URL.createObjectURL(new Blob([WORKER_SRC],{type:'text/javascript'})));
      const to=setTimeout(()=>{w.terminate();fin({error:timeoutMsg});},ms);
      w.onmessage=e=>{clearTimeout(to);w.terminate();fin(e.data);};
      w.onerror=ev=>{clearTimeout(to);try{w.terminate();}catch(_){}if(ev.preventDefault)ev.preventDefault();main(payload).then(fin);};
      w.postMessage(payload);
    }catch(err){main(payload).then(fin);}
  });
}

function tsBox(){return '<div class="lab labbox"><h4>Código ao vivo (TypeScript)</h4><textarea class="ed lb-ed" rows="6" spellcheck="false" wrap="off" autocapitalize="off" autocomplete="off" placeholder="// escreva em TypeScript e cole no Playground para ver os erros" aria-label="Editor de TypeScript"></textarea><div class="row" style="margin-top:10px"><button class="btn small lb-copy">Copiar código</button><a class="btn ghost small" href="https://www.typescriptlang.org/play" target="_blank" rel="noopener">Abrir o TS Playground</a></div></div>';}
function mountTsBox(root){const ed=$('.lb-ed',root);ed.onkeydown=e=>tabKey(e);$('.lb-copy',root).onclick=async()=>{try{await navigator.clipboard.writeText(ed.value);toast('Código copiado');}catch(e){ed.select();toast('Selecionado: use Ctrl + C');}};}
function aspSteps(l){return l.steps.filter(x=>x.kind!=='lesson'||(l.id===12&&x.title==='O que você aprendeu'));}
function trainSteps(l){
  const out=l.id===1?[{kind:'opening'},{kind:'cover'}]:[{kind:'cover'}];
  l.steps.forEach(s=>{
    if(s.kind==='story'||s.kind==='quiz'||s.kind==='order'||s.bonus)return;
    if(s.kind==='blocks'&&!(l.id===1&&/repetir/.test(s.title)))return;
    if((s.kind==='code'||s.kind==='tscheck')&&l.id!==6&&l.id!==11)return;
    if((l.id===6&&/^Desafio [34]/.test(s.title))||(l.id===11&&/^Desafio [23]/.test(s.title)))return;
    if(s.kind==='lesson'){(SL[s.title]||[]).forEach(x=>out.push(x));return;}
    out.push(s);});
  if(l.id===LV.length)out.push({kind:'ending'});
  return out;
}

function setArt(i){const bd=document.querySelector('.backdrop');if(!bd)return;let a=bd.querySelector('.art');if(!a){a=document.createElement('div');a.className='art';bd.prepend(a);}a.style.backgroundImage='url("'+ART[i%ART.length]+'")';}
setArt(0);

function renderHud(){
  try{setArt(cur&&view==='level'?cur.L.id:0);}catch(e){}
  const r=rank();document.body.dataset.mode=S.mode;document.body.classList.remove('big');
  const hearts=cur&&view==='level'&&!TR()?'<span class="hearts" aria-label="'+cur.hearts+' vidas">'+[1,2,3].map(i=>heart(i<=cur.hearts)).join('')+'</span>':'';
  const xp=TR()?'':'<span class="pill" title="'+r.name+'"><span>'+S.xp+' XP</span><span class="xpbar"><i style="width:'+Math.round(r.pct*100)+'%"></i></span></span>';
  const IC_LAB='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2.2h12.4a1.5 1.5 0 0 0 1.3-2.2L14 9V3"/><path d="M7.5 15h9"/></svg>';
  $('#hud').innerHTML='<i class="brk"></i><div class="stats">'+hearts+xp+'</div><div class="tools"><button class="tbtn" id="labbtn" title="Laboratório de código" aria-label="Laboratório de código">'+IC_LAB+'<span>Laboratório</span></button></div>'
   +'<div class="msw" role="group" aria-label="Modo"><button class="modebtn" data-m="asp" aria-pressed="'+!TR()+'">Aspirante</button><button class="modebtn" data-m="train" aria-pressed="'+TR()+'">Treinamento</button></div>';
  $('#labbtn').onclick=renderLabView;
  $$('.msw button').forEach(b=>b.onclick=()=>{if(S.mode===b.dataset.m)return;S.mode=b.dataset.m;save();renderMap();});
}


/* ============ mapa do Aspirante ============ */
function worldMap(first){
  const W=800,H=1700;
  const pts=LV.map((l,i)=>({x:i%2?580:220,y:170+i*120,l}));
  const route=[{x:400,y:50}].concat(pts,[{x:400,y:1640}]);
  let d='M'+route[0].x+' '+route[0].y;
  for(let i=0;i<route.length-1;i++){const p0=route[Math.max(0,i-1)],p1=route[i],p2=route[i+1],p3=route[Math.min(route.length-1,i+2)];
    d+=' C'+(p1.x+(p2.x-p0.x)/6).toFixed(1)+' '+(p1.y+(p2.y-p0.y)/6).toFixed(1)+','+(p2.x-(p3.x-p1.x)/6).toFixed(1)+' '+(p2.y-(p3.y-p1.y)/6).toFixed(1)+','+p2.x+' '+p2.y;}
  const checkSvg='<svg viewBox="0 0 24 24" width="48%" height="48%" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';
  const bg='<svg class="wm-bg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" aria-hidden="true"><defs>'
   +'<pattern id="wmDots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="currentColor"/></pattern></defs>'
   +'<rect class="wground" width="'+W+'" height="'+H+'"/><rect class="wdots" width="'+W+'" height="'+H+'" fill="url(#wmDots)"/>'
   +'<path class="wpath0" d="'+d+'"/><path class="wpath" d="'+d+'"/></svg>';
  const sign=(y,t,left)=>'<div class="wsign'+(left?' wleft':'')+'" style="top:'+(y/H*100).toFixed(2)+'%"><b>'+t+'</b></div>';

function tabKey(e){if(e.key==='Tab'){e.preventDefault();const t=e.target,a=t.selectionStart;t.value=t.value.slice(0,a)+'  '+t.value.slice(t.selectionEnd);t.selectionStart=t.selectionEnd=a+2;}}
function labBox(src,rows,title){return '<div class="lab labbox"><h4>'+(title||'Teste você: edite e execute')+'</h4><textarea class="ed lb-ed" rows="'+rows+'" spellcheck="false" wrap="off" autocapitalize="off" autocomplete="off" placeholder="// escreva o código aqui e execute com Ctrl + Enter" aria-label="Editor de código">'+esc(src)+'</textarea><div class="row" style="margin-top:10px"><button class="btn small lb-run">Executar</button><button class="btn ghost small lb-reset">'+(src?'Restaurar exemplo':'Limpar')+'</button><span class="hintkey">Ctrl + Enter</span></div><pre class="out lb-out" style="white-space:pre-wrap">A saída do console.log aparece aqui.</pre></div>';}
function mountLabBox(root,src){
  let base=src;const ed=$('.lb-ed',root),out=$('.lb-out',root);
  async function run(){
    const b=$('.lb-run',root);b.disabled=true;b.textContent='Executando...';
    const r=await runLab(ed.value);b.disabled=false;b.textContent='Executar';
    let t=(r.logs||[]).join('\n');
    if(r.noEval){t='Este ambiente não permite rodar código digitado aqui. Use o VS Code ou o console do navegador.';out.className='out lb-out err';}
    else if(r.error){t+=(t?'\n':'')+r.error;out.className='out lb-out err';}
    else out.className='out lb-out';
    out.textContent=t||'(nada foi impresso: use console.log para mostrar valores)';
  }
  ed.onkeydown=e=>{tabKey(e);if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();run();}};
  $('.lb-run',root).onclick=run;
  $('.lb-reset',root).onclick=()=>{ed.value=base;out.className='out lb-out';out.textContent='A saída do console.log aparece aqui.';};
  return{set(v){base=v;ed.value=v;}};
}

/* ============ quebra-cabeça de blocos (estilo Scratch) ============ */
const DIRS=['N','E','S','W'],DV={N:[-1,0],E:[0,1],S:[1,0],W:[0,-1]},DARR={N:'▲',E:'▶',S:'▼',W:'◀'};
const PAL={move:['mv','andar'],left:['mv','virar à esquerda'],right:['mv','virar à direita'],repeat:['repeat','repetir'],if:['if','se / senão']};
const BNAME={move:'andar',left:'virar à esquerda',right:'virar à direita'};
let bid=0;
const mk=t=>({id:++bid,t:t,n:3,body:[],els:[]});
function findNode(list,id){for(const n of list){if(n.id===id)return n;for(const k of ['body','els']){const r=findNode(n[k],id);if(r)return r;}}return null;}
function removeNode(list,id){const i=list.findIndex(n=>n.id===id);if(i>=0){list.splice(i,1);return true;}return list.some(n=>removeNode(n.body,id)||removeNode(n.els,id));}
const countB=list=>list.reduce((a,n)=>a+1+countB(n.body)+countB(n.els),0);
function toJs(list,ind){ind=ind||'';return list.map(n=>{
  if(n.t==='move')return ind+'andar();';
  if(n.t==='left')return ind+'virarEsquerda();';
  if(n.t==='right')return ind+'virarDireita();';
  if(n.t==='repeat')return ind+'for (let i = 0; i < '+n.n+'; i++) {\n'+(toJs(n.body,ind+'  ')||ind+'  // vazio')+'\n'+ind+'}';
  return ind+'if (caminhoLivre()) {\n'+(toJs(n.body,ind+'  ')||ind+'  // vazio')+'\n'+ind+'} else {\n'+(toJs(n.els,ind+'  ')||ind+'  // vazio')+'\n'+ind+'}';}).join('\n');}
function simulate(prog,g,start){
  const rows=g.length,cols=g[0].length;let r=start.r,c=start.c,d=start.d,status='',steps=0;const trace=[{r:r,c:c,d:d}];
  const free=()=>{const dv=DV[d],nr=r+dv[0],nc=c+dv[1];return nr>=0&&nr<rows&&nc>=0&&nc<cols&&g[nr][nc]!=='#';};
  const exec=list=>{for(const n of list){
    if(status)return;if(++steps>400){status='limit';return;}
    if(n.t==='move'){if(!free()){status='wall';trace.push({r:r,c:c,d:d,ev:'bump'});return;}const dv=DV[d];r+=dv[0];c+=dv[1];trace.push({r:r,c:c,d:d});if(g[r][c]==='G'){status='goal';return;}}
    else if(n.t==='left'){d=DIRS[(DIRS.indexOf(d)+3)%4];trace.push({r:r,c:c,d:d});}
    else if(n.t==='right'){d=DIRS[(DIRS.indexOf(d)+1)%4];trace.push({r:r,c:c,d:d});}
    else if(n.t==='repeat'){for(let k=0;k<n.n&&!status;k++)exec(n.body);}
    else if(n.t==='if'){exec(free()?n.body:n.els);}
  }};
  exec(prog);if(!status)status='end';return{trace:trace,status:status};
}
function locate(list,id){const i=list.findIndex(n=>n.id===id);if(i>=0)return{list:list,index:i};for(const n of list){for(const k of ['body','els']){const r=locate(n[k],id);if(r)return r;}}return null;}
function rBlocks(s,st){
  const i=cur.idx,g=s.grid,cols=g[0].length;let start={r:0,c:0,d:s.dir};
  g.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==='S')start={r:r,c:c,d:s.dir};}));
  const P=[];let busy=false,drag=null;
  const LBL={move:'andar',left:'virar à esquerda',right:'virar à direita',repeat:'repetir',if:'se caminho livre'};
  const cells=g.map(row=>[...row].map(ch=>'<div class="cell '+(ch==='#'?'w':ch==='G'?'g':'')+'"></div>').join('')).join('');
  /* um bloco em formato de peça de quebra-cabeça */
  const blk=(n,tpl)=>{
    const a=tpl?'data-tpl="'+n.t+'" tabindex="0" role="button" aria-label="Bloco '+LBL[n.t]+'. Enter adiciona ao programa"':'data-bid="'+n.id+'" tabindex="0"';
    if(n.t==='move')return '<div class="sb" '+a+'><span>andar</span><i class="ic">→</i></div>';
    if(n.t==='right')return '<div class="sb" '+a+'><span>virar</span><i class="ic">↻</i><span>à direita</span></div>';
    if(n.t==='left')return '<div class="sb" '+a+'><span>virar</span><i class="ic">↺</i><span>à esquerda</span></div>';
    const mouth=(key,list)=>'<div class="cb-mouth list" '+(tpl?'':'data-list="'+n.id+':'+key+'"')+'>'+list.map(c=>blk(c,false)).join('')+'</div>';
    if(n.t==='repeat')return '<div class="cb" '+a+'><div class="cb-top"><span>repetir</span>'+(tpl?'<b class="num">3</b>':'<input class="num" type="number" min="1" max="12" value="'+n.n+'" data-n="'+n.id+'" aria-label="quantas vezes">')+'<span>vezes</span></div>'+mouth('body',n.body)+'<div class="cb-bot"></div></div>';
    return '<div class="cb" '+a+'><div class="cb-top"><span>se</span><span class="hex">caminho livre?</span><span>então</span></div>'+mouth('body',n.body)+'<div class="cb-mid">senão</div>'+mouth('els',n.els)+'<div class="cb-bot"></div></div>';
  };
  const motion=s.blocks.filter(b=>b==='move'||b==='left'||b==='right'),control=s.blocks.filter(b=>b==='repeat'||b==='if');
  const tpls=arr=>arr.map(b=>'<div class="tplwrap">'+blk({t:b,body:[],els:[]},true)+'</div>').join('');
  st.innerHTML='<article class="card"><h2>'+s.title+'</h2>'+coach(s.who,s.mood,s.say)+'<p>'+s.task+'</p>'
   +'<div class="stagebar"><div class="board-wrap"><div class="board" id="bd" style="--cols:'+cols+'">'+cells+'<div class="actor" id="ac" style="--r:'+start.r+';--c:'+start.c+'">'+actorIcon()+'<i class="dir" id="dr">'+DARR[start.d]+'</i></div></div></div>'
   +'<div class="runbox"><button class="btn" id="go">▶ Executar</button><button class="btn ghost small" id="clr">Limpar</button><button class="btn ghost small" id="hint">Dica</button><span id="cnt" class="tchip"></span></div></div>'
   +'<p class="muted">Arraste os blocos da esquerda e encaixe embaixo de "quando ▶ for clicado". Para apagar, arraste o bloco de volta para a paleta.</p>'
   +'<div class="build"><aside class="palette2" id="pal"><h4>Blocos</h4>'+(motion.length?'<div class="cat">Movimento</div>'+tpls(motion):'')+(control.length?'<div class="cat ctl">Controle</div>'+tpls(control):'')+'</aside><div class="ws" id="ws"></div></div>'
   +'<div id="fb"></div><div id="jswrap" hidden><p><b>Seu programa em JavaScript:</b></p><pre class="code" id="js"></pre></div></article>';
  const ac=$('#ac',st),dr=$('#dr',st),fb=$('#fb',st),ws=$('#ws',st),pal=$('#pal',st);
  const place=(r,c,d)=>{ac.style.setProperty('--r',r);ac.style.setProperty('--c',c);dr.textContent=DARR[d];};
  const getList=id=>{if(id==='root')return P;const p=id.split(':'),n=findNode(P,+p[0]);return n?n[p[1]]:P;};
  function info(){
    const n=countB(P);$('#cnt',st).textContent='Blocos: '+n+' / '+s.max;$('#cnt',st).className='tchip'+(n>s.max?' over':'');
    $('#jswrap',st).hidden=!P.length;$('#js',st).innerHTML=hl(toJs(P));
  }
  function refresh(){
    ws.innerHTML='<div class="wsin"><div class="sb hat" id="hat"><span>quando</span><i class="flag">▶</i><span>for clicado</span></div><div class="list stack" data-list="root">'+P.map(n=>blk(n,false)).join('')+'</div></div>';
    info();
  }
  /* ---- arrastar e soltar ---- */
  const dropline=document.createElement('div');dropline.className='dropline';dropline.hidden=true;document.body.appendChild(dropline);
  function pickTarget(gx,gy){
    let best=null;
    $$('[data-list]',ws).forEach(el=>{
      const r=el.getBoundingClientRect(),kids=[...el.children].filter(c=>c.dataset.bid),pts=[];
      kids.forEach((k,ix)=>pts.push({i:ix,y:k.getBoundingClientRect().top}));
      pts.push({i:kids.length,y:kids.length?kids[kids.length-1].getBoundingClientRect().bottom:r.top});
      pts.forEach(p=>{const d=Math.hypot((r.left-gx)*.7,p.y-gy);if(!best||d<best.d)best={d:d,listId:el.dataset.list,index:p.i,x:r.left,y:p.y};});
    });
    return best;
  }
  const overWs=(x,y)=>{const r=ws.getBoundingClientRect();return x>=r.left-10&&x<=r.right+10&&y>=r.top-10&&y<=r.bottom+10;};
  function cleanupDrag(){window.removeEventListener('pointermove',onMove);window.removeEventListener('pointerup',onUp);window.removeEventListener('pointercancel',onCancel);dropline.hidden=true;pal.classList.remove('trash');if(drag&&drag.ghost)drag.ghost.remove();}
  function onDown(e){
    if(busy||(e.button&&e.button!==0))return;
    if(e.target.closest('input')||e.target.closest('.dragghost'))return;
    const t=e.target.closest('[data-tpl]'),b=e.target.closest('[data-bid]'),el=t||b;
    if(!el||!st.contains(el))return;
    const r=el.getBoundingClientRect();
    drag={tpl:t?t.dataset.tpl:null,bid:(!t&&b)?+b.dataset.bid:null,sx:e.clientX,sy:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,w:r.width,started:false,stack:null,ghost:null,tgt:null};
    window.addEventListener('pointermove',onMove);window.addEventListener('pointerup',onUp);window.addEventListener('pointercancel',onCancel);
    e.preventDefault();
  }
  function begin(){
    drag.started=true;
    if(drag.tpl)drag.stack=[mk(drag.tpl)];
    else{const loc=locate(P,drag.bid);drag.stack=loc.list.splice(loc.index);refresh();}
    const gh=document.createElement('div');gh.className='dragghost list';gh.style.width=Math.max(drag.w,120)+'px';
    gh.innerHTML=drag.stack.map(n=>blk(n,false)).join('');
    gh.querySelectorAll('[data-list],[data-bid],[tabindex]').forEach(x=>{x.removeAttribute('data-list');x.removeAttribute('data-bid');x.removeAttribute('tabindex');});
    document.body.appendChild(gh);drag.ghost=gh;
  }
  function onMove(e){
    if(!drag)return;
    if(!drag.started){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<6)return;begin();}
    const gx=e.clientX-drag.ox,gy=e.clientY-drag.oy;
    drag.ghost.style.left=gx+'px';drag.ghost.style.top=gy+'px';
    if(overWs(e.clientX,e.clientY)){drag.tgt=pickTarget(gx,gy);pal.classList.remove('trash');
      if(drag.tgt){dropline.hidden=false;dropline.style.left=drag.tgt.x+'px';dropline.style.top=(drag.tgt.y-2)+'px';dropline.style.width=Math.max(70,drag.w)+'px';}}
    else{drag.tgt=null;dropline.hidden=true;if(drag.bid!=null)pal.classList.add('trash');}
  }
  function onUp(e){
    const d=drag;cleanupDrag();drag=null;if(!d)return;
    if(!d.started){if(d.tpl){P.push(mk(d.tpl));refresh();}return;}
    if(d.tgt)getList(d.tgt.listId).splice(d.tgt.index,0,...d.stack);
    refresh();
  }
  function onCancel(){const d=drag;cleanupDrag();drag=null;if(d&&d.started&&d.bid!=null)P.push(...d.stack);refresh();}
  st.addEventListener('pointerdown',onDown);
  st.addEventListener('keydown',e=>{
    const t=e.target.closest('[data-tpl]'),b=e.target.closest('[data-bid]');
    if((e.key==='Enter'||e.key===' ')&&t&&e.target===t){e.preventDefault();P.push(mk(t.dataset.tpl));refresh();}
    if((e.key==='Delete'||e.key==='Backspace')&&b&&e.target===b){e.preventDefault();removeNode(P,+b.dataset.bid);refresh();}
  });
  ws.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.n){const n=findNode(P,+t.dataset.n);if(n){n.n=Math.max(1,Math.min(12,+t.value||1));info();}}});
  $('#clr',st).onclick=()=>{if(busy)return;P.length=0;refresh();place(start.r,start.c,start.d);fb.innerHTML='';};
  $('#hint',st).onclick=()=>{fb.innerHTML='<div class="fb info">Dica: '+s.hint+'</div>';};
  function endRun(sim){
    busy=false;
    if(sim.status==='goal'){const first=!cur.tries[i];award('b'+cur.L.id+'-'+i,first?30:20);fb.innerHTML='<div class="fb good">Chegou ao destino! '+s.why+'</div>';markOk();}
    else{cur.tries[i]=(cur.tries[i]||0)+1;const m={wall:'Bateu na parede. Confira onde ele vira.',limit:'O programa não termina (passos demais). Confira os blocos de repetição.',end:'O programa acabou sem chegar ao destino. Faltou algum passo?'}[sim.status];fb.innerHTML='<div class="fb bad">'+m+'</div>';}
  }
  function run(){
    if(busy)return;
    if(!P.length){fb.innerHTML='<div class="fb info">Monte um programa primeiro: arraste blocos para baixo de "quando ▶ for clicado".</div>';return;}
    if(countB(P)>s.max){fb.innerHTML='<div class="fb bad">Programa grande demais: use no máximo '+s.max+' blocos. Algum bloco de repetição ou de decisão ajuda?</div>';return;}
    const sim=simulate(P,g,start);busy=true;place(start.r,start.c,start.d);fb.innerHTML='';let k=0;
    const stepAnim=()=>{if(!cur||cur.idx!==i||view!=='level'){busy=false;return;}k++;
      if(k<sim.trace.length){const t=sim.trace[k];place(t.r,t.c,t.d);if(t.ev==='bump'){ac.classList.add('bump');setTimeout(()=>ac.classList.remove('bump'),320);}cur.pzT=setTimeout(stepAnim,340);}
      else endRun(sim);};
    cur.pzT=setTimeout(stepAnim,250);
  }
  $('#go',st).onclick=run;
  ws.addEventListener('click',e=>{if(e.target.closest('#hat'))run();});
  if(cur.ok[i])fb.innerHTML='<div class="fb good">Quebra-cabeça resolvido! Pode testar outras ideias.</div>';
  cur.pz={P:P,refresh:refresh,run:run};
  refresh();
}

function finish(){
  const l=cur.L;S.pos=null;save();clearInterval(tick);clearInterval(cur.exT);
  const nextL=LV.find(x=>x.id===l.id+1);
  if(TR()){
    view='done';renderHud();
    app.innerHTML='<article class="card finish"><h2>Tópico concluído</h2><p>'+esc(l.title)+'</p><div class="row">'+(nextL?'<button class="btn" id="nx">Próximo: '+esc(nextL.title)+'</button>':'')+'<button class="btn ghost" id="mp">Voltar ao roteiro</button></div></article>';
    if(nextL)$('#nx').onclick=()=>startLevel(nextL.id);
    $('#mp').onclick=renderMap;cur=null;window.scrollTo(0,0);return;
  }
  const n=Math.max(1,cur.hearts);
  S.done[l.id]=Math.max(S.done[l.id]||0,n);award('lvl'+l.id,20);save();
  const had=Object.assign({},S.badges);checkBadges();
  const newB=BADGES.filter(b=>S.badges[b.id]&&!had[b.id]);
  view='done';renderHud();
  app.innerHTML='<article class="card finish"><h2>'+(l.id===12?'Tudo completo!':'Nível completo!')+'</h2><p>'+esc(l.title)+' concluído.</p>'+stars(n)
   +(newB.length?'<div class="newb">'+newB.map(b=>'<span>★ '+b.name+'</span>').join('')+'</div>':'')
   +'<p><b>'+S.xp+' XP</b> no total · '+rank().name+'</p><div class="row">'+(nextL?'<button class="btn" id="nx">Próximo nível</button>':'')+'<button class="btn ghost" id="mp">Voltar ao mapa</button></div></article>';
  if(nextL)$('#nx').onclick=()=>startLevel(nextL.id);
  $('#mp').onclick=renderMap;cur=null;view='done';window.scrollTo(0,0);
}

let DL=null,fitMO=null,fitRaf=0;
function watchFit(w){if(fitMO)fitMO.disconnect();fitMO=new MutationObserver(()=>{cancelAnimationFrame(fitRaf);fitRaf=requestAnimationFrame(fitSlide);});fitMO.observe(w,{childList:true,subtree:true,characterData:true});}
function fitSlide(){
  if(!TR()||view!=='level'||!cur)return;
  const card=$('#stage > article.slide'),inner=card&&card.querySelector('.fit');if(!inner)return;
  const foot=$('.foot');
  const top=card.getBoundingClientRect().top+window.scrollY;
  const avail=Math.max(240,window.innerHeight-top-(foot&&!foot.hidden?foot.offsetHeight+18:0)-14);
  inner.style.transform='';inner.style.width='';inner.style.minHeight='';
  card.style.height=avail+'px';
  const cs=getComputedStyle(card);const availH=avail-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  if(card.querySelector('.build')){
    const natural=inner.scrollHeight;const kk=Math.min(1,(availH-6)/natural);
    if(kk<.999){inner.style.transform='scale('+kk+')';inner.style.transformOrigin='top center';inner.style.minHeight=(availH/kk)+'px';}
    card.style.overflow='hidden';return;
  }
  let k=1;
  const origin=(card.classList.contains('cover')||card.classList.contains('open'))?'left center':'top left';
  const test=kk=>{inner.style.width=(100/kk)+'%';inner.style.transform='scale('+kk+')';inner.style.transformOrigin=origin;return inner.scrollHeight*kk<=availH-18;};
  if(!test(1)){let lo=.35,hi=1;for(let i=0;i<10;i++){const mid=(lo+hi)/2;if(test(mid))lo=mid;else hi=mid;}k=lo;test(k);}
  else{let lo=1,hi=1.3;for(let i=0;i<8;i++){const mid=(lo+hi)/2;if(test(mid))lo=mid;else hi=mid;}k=lo;test(k);}
  if(Math.abs(k-1)<.01){inner.style.transform='';inner.style.width='';k=1;}
  inner.style.minHeight=(availH/k)+'px';
  card.style.overflow=k<=.36?'auto':'hidden';
}
window.addEventListener('resize',()=>{cancelAnimationFrame(fitRaf);fitRaf=requestAnimationFrame(fitSlide);});
$('#home').onclick=renderMap;
document.addEventListener('keydown',e=>{
  if(view!=='level'||!cur)return;
  const t=e.target.tagName;if(t==='TEXTAREA'||t==='INPUT'||t==='SELECT')return;
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(1);}else if(e.key==='ArrowLeft'||e.key==='PageUp')go(-1);
});
renderMap();
</script>
